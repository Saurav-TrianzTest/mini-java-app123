apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcontainermonotest-ingress
  namespace: mcontainermonotest
  labels:
    app: mcontainermonotest
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.allow-http: "true"
    networking.gke.io/managed-certificates: "mcontainermonotest-cert"
spec:
  rules:
    - host: mcontainermonotest.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcontainermonotest-service
                port:
                  number: 80
