apiVersion: v1
kind: ConfigMap
metadata:
  name: mini-java-container-config
  namespace: mini-java-container
  labels:
    app: mini-java-container
data:
  APP_PORT: "8080"
  HEALTH_PORT: "8081"
  CONFIG_PATH: "/app/config/app.properties"
  LOG_PATH: "/app/logs/mini-app.log"
  LOG_DIR: "/app/logs"
  DB_HOST: "localhost"
  DB_PORT: "3306"
  DB_NAME: "mini_app_db"
  REDIS_HOST: "localhost"
  REDIS_PORT: "6379"
  EXTERNAL_API_URL: "http://api.example.com:8080/v1"
  PAYMENT_SERVICE_URL: "https://payment.internal.company.com/process"
