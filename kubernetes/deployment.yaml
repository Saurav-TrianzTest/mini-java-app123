apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcontainermonotest
  namespace: mcontainermonotest
  labels:
    app: mcontainermonotest
    version: "1.0.0"
    managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mcontainermonotest
  template:
    metadata:
      labels:
        app: mcontainermonotest
        version: "1.0.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: mcontainermonotest
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: SERVER_PORT
              value: "8080"
            - name: TZ
              value: "UTC"
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UnlockExperimentalVMOptions -Djava.security.egd=file:/dev/./urandom"
            # Database configuration
            - name: DB_HOST
              value: "{{DB_HOST}}"
            - name: DB_PORT
              value: "{{DB_PORT}}"
            - name: DB_NAME
              value: "{{DB_NAME}}"
            - name: DB_USERNAME
              value: "{{DB_USERNAME}}"
            - name: DB_PASSWORD
              value: "{{DB_PASSWORD}}"
            # Redis / Cache configuration
            - name: REDIS_HOST
              value: "{{REDIS_HOST}}"
            - name: REDIS_PORT
              value: "{{REDIS_PORT}}"
            # External service URLs
            - name: EXTERNAL_API_URL
              value: "{{EXTERNAL_API_URL}}"
            - name: PAYMENT_SERVICE_URL
              value: "{{PAYMENT_SERVICE_URL}}"
            # File paths
            - name: LOG_DIR_PATH
              value: "/mnt/filestore/logs"
            - name: CONFIG_FILE_PATH
              value: "/app/config/app.properties"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          volumeMounts:
            - name: app-logs
              mountPath: /mnt/filestore/logs
            - name: app-config
              mountPath: /app/config
      volumes:
        - name: app-logs
          emptyDir: {}
        - name: app-config
          emptyDir: {}
      terminationGracePeriodSeconds: 30
      restartPolicy: Always
