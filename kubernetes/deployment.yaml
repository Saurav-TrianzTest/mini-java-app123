apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-java-app
  namespace: mini-java-app
  labels:
    app: mini-java-app
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mini-java-app
  template:
    metadata:
      labels:
        app: mini-java-app
        version: v1
    spec:
      containers:
      - name: mini-java-app
        image: {{IMAGE_URI}}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 8081
          name: management
          protocol: TCP
        env:
        # Server Configuration
        - name: SERVER_PORT
          value: "8080"
        - name: SERVER_HOST
          value: "0.0.0.0"
        - name: SERVER_CONTEXT_PATH
          value: "/mini-app"
        
        # Database Configuration
        - name: DATABASE_URL
          value: "{{DATABASE_URL}}"
        - name: DB_USERNAME
          value: "{{DB_USERNAME}}"
        - name: DB_PASSWORD
          value: "{{DB_PASSWORD}}"
        - name: DB_DRIVER
          value: "com.mysql.cj.jdbc.Driver"
        - name: DB_POOL_MAX_CONNECTIONS
          value: "20"
        - name: DB_POOL_TIMEOUT
          value: "5000"
        - name: DB_HOST
          value: "{{DB_HOST}}"
        - name: DB_PORT
          value: "{{DB_PORT}}"
        - name: DB_NAME
          value: "{{DB_NAME}}"
        
        # Redis Cache Configuration
        - name: REDIS_HOST
          value: "{{REDIS_HOST}}"
        - name: REDIS_PORT
          value: "{{REDIS_PORT}}"
        - name: REDIS_PASSWORD
          value: "{{REDIS_PASSWORD}}"
        - name: REDIS_DATABASE
          value: "0"
        
        # External API Configuration
        - name: EXTERNAL_API_URL
          value: "{{EXTERNAL_API_URL}}"
        - name: EXTERNAL_API_TIMEOUT
          value: "30000"
        - name: EXTERNAL_API_KEY
          value: "{{EXTERNAL_API_KEY}}"
        
        # Payment Service Configuration
        - name: PAYMENT_SERVICE_URL
          value: "{{PAYMENT_SERVICE_URL}}"
        - name: PAYMENT_SERVICE_USERNAME
          value: "{{PAYMENT_SERVICE_USERNAME}}"
        - name: PAYMENT_SERVICE_PASSWORD
          value: "{{PAYMENT_SERVICE_PASSWORD}}"
        
        # Azure Blob Storage Configuration
        - name: AZURE_STORAGE_CONNECTION_STRING
          value: "{{AZURE_STORAGE_CONNECTION_STRING}}"
        - name: AZURE_STORAGE_CONTAINER
          value: "mini-app-storage"
        - name: CONFIG_BLOB_NAME
          value: "config/app.properties"
        - name: LOG_BLOB_NAME
          value: "logs/mini-app.log"
        - name: TEMP_BLOB_PREFIX
          value: "temp/"
        - name: UPLOAD_BLOB_PREFIX
          value: "uploads/"
        
        # Security Configuration
        - name: JWT_SECRET
          value: "{{JWT_SECRET}}"
        - name: ADMIN_USERNAME
          value: "{{ADMIN_USERNAME}}"
        - name: ADMIN_PASSWORD
          value: "{{ADMIN_PASSWORD}}"
        - name: ENCRYPTION_KEY
          value: "{{ENCRYPTION_KEY}}"
        
        # Monitoring Configuration
        - name: MONITORING_ENDPOINT
          value: "{{MONITORING_ENDPOINT}}"
        - name: MONITORING_USERNAME
          value: "{{MONITORING_USERNAME}}"
        - name: MONITORING_PASSWORD
          value: "{{MONITORING_PASSWORD}}"
        
        # Messaging Configuration
        - name: RABBITMQ_HOST
          value: "{{RABBITMQ_HOST}}"
        - name: RABBITMQ_PORT
          value: "{{RABBITMQ_PORT}}"
        - name: RABBITMQ_USERNAME
          value: "{{RABBITMQ_USERNAME}}"
        - name: RABBITMQ_PASSWORD
          value: "{{RABBITMQ_PASSWORD}}"
        
        # Application Configuration
        - name: ENVIRONMENT
          value: "production"
        - name: DEBUG_ENABLED
          value: "false"
        - name: LOGGING_LEVEL
          value: "INFO"
        - name: DB_QUERY_TIMEOUT
          value: "30"
        
        # Spring Boot Configuration
        - name: SPRING_PROFILES_ACTIVE
          value: "docker"
        
        # JVM Configuration
        - name: JAVA_OPTS
          value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
        
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      
      restartPolicy: Always
