# Mini Java App Configuration
# Java 25 upgrade: sensitive values and environment-specific settings are now
# supplied via environment variables.  The placeholders below show the variable
# names that must be set in the deployment environment.

# Server configuration - override with SERVER_PORT env var
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:localhost}
server.context-path=/mini-app

# Database configuration - override with DB_* env vars
database.url=${DB_URL:jdbc:mysql://localhost:3306/mini_app_db}
database.username=${DB_USERNAME:root}
database.password=${DB_PASSWORD:}
database.driver=com.mysql.cj.jdbc.Driver
database.pool.max-connections=${DB_POOL_MAX:20}
database.pool.timeout=${DB_POOL_TIMEOUT:5000}

# Cache configuration - override with REDIS_* env vars
cache.redis.host=${REDIS_HOST:127.0.0.1}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=${REDIS_PASSWORD:}
cache.redis.database=${REDIS_DB:0}

# External service URLs - override with env vars
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com:8080/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
external.api.key=${EXTERNAL_API_KEY:}

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
payment.service.username=${PAYMENT_SERVICE_USERNAME:}
payment.service.password=${PAYMENT_SERVICE_PASSWORD:}

# File paths - override with APP_* env vars
app.config.directory=${APP_CONFIG_DIR:/opt/app/config}
app.log.directory=${APP_LOG_DIR:/var/log/mini-app}
app.temp.directory=${APP_TEMP_DIR:/tmp/mini-app}
app.upload.directory=${APP_UPLOAD_DIR:/opt/uploads}

# Security configuration - override with SECURITY_* env vars
security.jwt.secret=${SECURITY_JWT_SECRET:}
security.admin.username=${SECURITY_ADMIN_USERNAME:admin}
security.admin.password=${SECURITY_ADMIN_PASSWORD:}
security.encryption.key=${SECURITY_ENCRYPTION_KEY:}

# Monitoring/metrics endpoints - override with MONITORING_* env vars
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com:9090/metrics}
monitoring.username=${MONITORING_USERNAME:}
monitoring.password=${MONITORING_PASSWORD:}

# Messaging configuration - override with MESSAGING_* env vars
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.internal.company.com}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${RABBITMQ_USERNAME:}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD:}

# Environment settings
environment=${APP_ENV:development}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOG_LEVEL:INFO}
