# Mini Java App Configuration - Containerized with Externalized Configuration

# FIXED: Server configuration using environment variables
# Set via environment: SERVER_PORT, SERVER_HOST, SERVER_CONTEXT_PATH
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:0.0.0.0}
server.context-path=${SERVER_CONTEXT_PATH:/mini-app}

# FIXED blocker-4, blocker-6: Database configuration using environment variables
# Set via environment: DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
database.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mini_app_db}
database.username=${DB_USERNAME:root}
database.password=${DB_PASSWORD:password123}
database.driver=com.mysql.cj.jdbc.Driver
database.pool.max-connections=${DB_POOL_MAX_CONNECTIONS:20}
database.pool.timeout=${DB_POOL_TIMEOUT:5000}

# FIXED blocker-4, blocker-6: Cache configuration using DNS-based service discovery
# Set via environment: REDIS_HOST, REDIS_PORT, REDIS_PASSWORD, REDIS_DATABASE
cache.redis.host=${REDIS_HOST:redis.service.local}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=${REDIS_PASSWORD:}
cache.redis.database=${REDIS_DATABASE:0}

# FIXED blocker-3: External service URLs for microservices architecture
# Set via environment: EXTERNAL_API_URL, EXTERNAL_API_TIMEOUT, EXTERNAL_API_KEY
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com:8080/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
external.api.key=${EXTERNAL_API_KEY:}

# FIXED blocker-3: Payment service configuration
# Set via environment: PAYMENT_SERVICE_URL, PAYMENT_SERVICE_USERNAME, PAYMENT_SERVICE_PASSWORD
payment.service.url=${PAYMENT_SERVICE_URL:https://payment.service.local/process}
payment.service.username=${PAYMENT_SERVICE_USERNAME:}
payment.service.password=${PAYMENT_SERVICE_PASSWORD:}

# FIXED blocker-1, blocker-2: S3 configuration for cloud-native storage
# Set via environment: CONFIG_S3_BUCKET, CONFIG_S3_KEY, AWS_REGION
app.config.s3.bucket=${CONFIG_S3_BUCKET:app-config-bucket}
app.config.s3.key=${CONFIG_S3_KEY:config/app.properties}
app.s3.region=${AWS_REGION:us-east-1}

# FIXED blocker-7, blocker-8, blocker-9: Logging configuration for container environments
# Logs are written to stdout/stderr and automatically collected by container runtime
logging.level.root=${LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# FIXED: Security configuration using environment variables
# Set via environment: JWT_SECRET, ADMIN_USERNAME, ADMIN_PASSWORD, ENCRYPTION_KEY
security.jwt.secret=${JWT_SECRET:}
security.admin.username=${ADMIN_USERNAME:}
security.admin.password=${ADMIN_PASSWORD:}
security.encryption.key=${ENCRYPTION_KEY:}

# FIXED: Monitoring configuration using environment variables
# Set via environment: MONITORING_ENDPOINT, MONITORING_USERNAME, MONITORING_PASSWORD
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.service.local:9090/metrics}
monitoring.username=${MONITORING_USERNAME:}
monitoring.password=${MONITORING_PASSWORD:}

# FIXED: Messaging configuration using environment variables
# Set via environment: RABBITMQ_HOST, RABBITMQ_PORT, RABBITMQ_USERNAME, RABBITMQ_PASSWORD
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.service.local}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${RABBITMQ_USERNAME:}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD:}

# FIXED: Environment-specific configuration using environment variables
environment=${ENVIRONMENT:production}
debug.enabled=${DEBUG_ENABLED:false}
