# Mini Java App Configuration - Containerization Ready

# Server configuration - externalized for container deployment
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:0.0.0.0}
server.context-path=/mini-app

# Spring Boot Actuator - Health Check Endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

# Database configuration - externalized using environment variables
database.url=${DB_URL:jdbc:mysql://mysql-service:3306/mini_app_db}
database.username=${DB_USERNAME:root}
database.password=${DB_PASSWORD:password}
database.driver=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
database.pool.max-connections=${DB_POOL_MAX_CONNECTIONS:20}
database.pool.timeout=${DB_POOL_TIMEOUT:5000}

# Cache configuration - externalized for Kubernetes service discovery
cache.redis.host=${REDIS_HOST:redis-service}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=${REDIS_PASSWORD:}
cache.redis.database=${REDIS_DATABASE:0}

# External service URLs - externalized for microservices architecture
external.api.base-url=${EXTERNAL_API_URL:http://api-service:8080/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
external.api.key=${EXTERNAL_API_KEY:}

payment.service.url=${PAYMENT_SERVICE_URL:http://payment-service/process}
payment.service.username=${PAYMENT_SERVICE_USERNAME:}
payment.service.password=${PAYMENT_SERVICE_PASSWORD:}

# File paths - migrated to Google Cloud Storage
app.config.bucket=${GCS_CONFIG_BUCKET:gs://app-config-bucket}
app.log.bucket=${GCS_LOG_BUCKET:gs://app-logs-bucket}
app.temp.bucket=${GCS_TEMP_BUCKET:gs://app-temp-bucket}
app.upload.bucket=${GCS_UPLOAD_BUCKET:gs://app-uploads-bucket}

# Security configuration - externalized using environment variables
security.jwt.secret=${JWT_SECRET:}
security.admin.username=${ADMIN_USERNAME:}
security.admin.password=${ADMIN_PASSWORD:}
security.encryption.key=${ENCRYPTION_KEY:}

# Monitoring/metrics endpoints - externalized for cloud-native observability
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring-service:9090/metrics}
monitoring.username=${MONITORING_USERNAME:}
monitoring.password=${MONITORING_PASSWORD:}

# Messaging configuration - externalized for Kubernetes service discovery
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq-service}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${RABBITMQ_USERNAME:}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD:}

# Environment configuration - externalized
environment=${ENVIRONMENT:production}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOGGING_LEVEL:INFO}
