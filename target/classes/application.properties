# Mini Java App Configuration - Containerization Ready with Environment Variables

# Server configuration - externalized for container deployment
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:0.0.0.0}
server.context-path=/mini-app

# Database configuration - externalized for container environments
database.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mini_app_db}
database.username=${DB_USERNAME:root}
database.password=${DB_PASSWORD:password123}
database.driver=com.mysql.cj.jdbc.Driver
database.pool.max-connections=${DB_POOL_MAX_CONNECTIONS:20}
database.pool.timeout=${DB_POOL_TIMEOUT:5000}

# Cache configuration - externalized for Redis service discovery
cache.redis.host=${REDIS_HOST:127.0.0.1}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=${REDIS_PASSWORD:redis_secret_123}
cache.redis.database=${REDIS_DATABASE:0}

# External service URLs - externalized for service mesh
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com:8080/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
external.api.key=${EXTERNAL_API_KEY:hardcoded_api_key_12345}

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
payment.service.username=${PAYMENT_SERVICE_USERNAME:payment_user}
payment.service.password=${PAYMENT_SERVICE_PASSWORD:payment_secret_456}

# S3 configuration for file storage - replaces local filesystem
s3.bucket.name=${S3_BUCKET_NAME:mini-app-config-bucket}
s3.config.key=${CONFIG_S3_KEY:config/app.properties}
s3.log.key=${LOG_S3_KEY:logs/mini-app.log}
s3.temp.prefix=${S3_TEMP_PREFIX:temp/}
s3.upload.prefix=${S3_UPLOAD_PREFIX:uploads/}

# AWS region configuration
aws.region=${AWS_REGION:us-east-1}

# Security configuration - externalized for AWS Secrets Manager
security.jwt.secret=${JWT_SECRET:my_super_secret_jwt_key_123456789}
security.admin.username=${ADMIN_USERNAME:admin}
security.admin.password=${ADMIN_PASSWORD:admin123}
security.encryption.key=${ENCRYPTION_KEY:encryption_key_hardcoded}

# Monitoring/metrics endpoints - externalized for service discovery
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com:9090/metrics}
monitoring.username=${MONITORING_USERNAME:monitor_user}
monitoring.password=${MONITORING_PASSWORD:monitor_pass}

# Messaging configuration - externalized for RabbitMQ service
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.internal.company.com}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${RABBITMQ_USERNAME:rabbitmq_user}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD:rabbitmq_secret}

# Environment configuration - externalized
environment=${ENVIRONMENT:production}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOGGING_LEVEL:INFO}

# Spring Boot Actuator configuration for health checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.defaults.enabled=true
