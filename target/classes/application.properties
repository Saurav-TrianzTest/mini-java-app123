# Mini Java App Configuration - Updated for PostgreSQL 16 Compatibility
#
# DB Migration Changes:
#  - [CRITICAL] Replaced MySQL JDBC URL (jdbc:mysql://...) with PostgreSQL JDBC URL (jdbc:postgresql://...)
#  - [CRITICAL] Replaced com.mysql.cj.jdbc.Driver with org.postgresql.Driver
#  - [HIGH]     Updated Spring DataSource properties to use spring.datasource.* namespace
#  - [HIGH]     Configured HikariCP connection pool settings for PostgreSQL
#  - [MEDIUM]   Added PostgreSQL-specific JPA/Hibernate dialect configuration
#  - [MEDIUM]   Added spring.jpa.properties for PostgreSQL schema and naming conventions

# Server configuration (externalized via environment variables for containerization)
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/mini-app

# ─── PostgreSQL DataSource Configuration ───────────────────────────────────────
# [CRITICAL] Replaced MySQL JDBC URL with PostgreSQL JDBC URL format:
#   Before: database.url=jdbc:mysql://localhost:3306/mini_app_db
#   After:  spring.datasource.url=jdbc:postgresql://localhost:5432/mini_app_db
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mini_app_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password123}

# [CRITICAL] Replaced MySQL driver class with PostgreSQL driver class:
#   Before: database.driver=com.mysql.cj.jdbc.Driver
#   After:  spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── HikariCP Connection Pool (replaces custom database.pool.* properties) ─────
# [HIGH] Migrated from custom pool settings to Spring Boot HikariCP standard properties
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_CONNECTIONS:20}
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT:5000}
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=PostgreSQLHikariPool

# ─── JPA / Hibernate Configuration for PostgreSQL ──────────────────────────────
# [MEDIUM] Set PostgreSQL dialect explicitly for Hibernate 6 / Spring Boot 3.x
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# [MEDIUM] PostgreSQL-specific: use snake_case naming convention for table/column names
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# [MEDIUM] PostgreSQL default schema
spring.jpa.properties.hibernate.default_schema=public

# ─── Cache Configuration (Redis) ───────────────────────────────────────────────
cache.redis.host=${REDIS_HOST:127.0.0.1}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=${REDIS_PASSWORD:redis_secret_123}
cache.redis.database=0

# ─── External Service URLs ──────────────────────────────────────────────────────
external.api.base-url=${EXTERNAL_API_BASE_URL:http://api.example.com:8080/v1}
external.api.timeout=30000
external.api.key=${EXTERNAL_API_KEY:hardcoded_api_key_12345}

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
payment.service.username=${PAYMENT_SERVICE_USERNAME:payment_user}
payment.service.password=${PAYMENT_SERVICE_PASSWORD:payment_secret_456}

# ─── File Paths ─────────────────────────────────────────────────────────────────
app.config.directory=${APP_CONFIG_DIR:/opt/app/config}
app.log.directory=${APP_LOG_DIR:/var/log/mini-app}
app.temp.directory=${APP_TEMP_DIR:/tmp/mini-app}
app.upload.directory=${APP_UPLOAD_DIR:/opt/uploads}

# ─── Security Configuration ─────────────────────────────────────────────────────
security.jwt.secret=${JWT_SECRET:my_super_secret_jwt_key_123456789}
security.admin.username=${ADMIN_USERNAME:admin}
security.admin.password=${ADMIN_PASSWORD:admin123}
security.encryption.key=${ENCRYPTION_KEY:encryption_key_hardcoded}

# ─── Monitoring / Metrics ───────────────────────────────────────────────────────
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com:9090/metrics}
monitoring.username=${MONITORING_USERNAME:monitor_user}
monitoring.password=${MONITORING_PASSWORD:monitor_pass}

# ─── Messaging (RabbitMQ) ───────────────────────────────────────────────────────
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.internal.company.com}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${RABBITMQ_USERNAME:rabbitmq_user}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD:rabbitmq_secret}

# ─── Application Environment ────────────────────────────────────────────────────
environment=${APP_ENV:production}
debug.enabled=false
logging.level.root=INFO
logging.level.com.test=INFO
