version: "3.8"

services:
  mcontainermono-test:
    image: mcontainermonotest:latest
    container_name: mcontainermonotest-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080
      - DB_HOST=${DB_HOST:-localhost}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-mini_app_db}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - REDIS_HOST=${REDIS_HOST:-redis-service}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - EXTERNAL_API_URL=${EXTERNAL_API_URL:-http://api.example.com:8080/v1}
      - PAYMENT_SERVICE_URL=${PAYMENT_SERVICE_URL:-https://payment.internal.company.com/process}
      - LOG_DIR_PATH=${LOG_DIR_PATH:-/mnt/filestore/logs}
      - CONFIG_FILE_PATH=${CONFIG_FILE_PATH:-/app/config/app.properties}
      - TZ=UTC
    volumes:
      - app-logs:/mnt/filestore/logs
      - ./config:/app/config
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  app-logs:
    driver: local
