version: "3.8"

services:
  mini-java-container:
    image: mini-java-container:latest
    ports:
      - "${APP_PORT:-8080}:8080"
      - "${HEALTH_PORT:-8081}:8081"
    environment:
      - APP_PORT=${APP_PORT:-8080}
      - HEALTH_PORT=${HEALTH_PORT:-8081}
      - CONFIG_PATH=${CONFIG_PATH:-/app/config/app.properties}
      - LOG_PATH=${LOG_PATH:-/app/logs/mini-app.log}
      - LOG_DIR=${LOG_DIR:-/app/logs}
      - DB_HOST=${DB_HOST:?set DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-mini_app_db}
      - DB_USERNAME=${DB_USERNAME:?set DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:-localhost}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - EXTERNAL_API_URL=${EXTERNAL_API_URL:-http://api.example.com:8080/v1}
      - PAYMENT_SERVICE_URL=${PAYMENT_SERVICE_URL:-https://payment.internal.company.com/process}
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - /tmp/mini-app:/tmp/mini-app
