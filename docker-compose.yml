version: '3.8'

services:
  mini-java-app:
    build: .
    container_name: mini-java-app
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      # Server Configuration
      - SERVER_PORT=8080
      - SERVER_HOST=0.0.0.0
      - ENVIRONMENT=development

      # Database Configuration
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=mini_app_db
      - DB_USERNAME=root
      - DB_PASSWORD=password123
      - DB_POOL_MAX_SIZE=20
      - DB_POOL_MIN_IDLE=5
      - DB_CONNECTION_TIMEOUT=30000

      # Cache Configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=

      # Logging Configuration
      - LOGGING_LEVEL=INFO
      - DEBUG_ENABLED=false

    depends_on:
      - mysql
      - redis
    networks:
      - app-network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: mini-java-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=password123
      - MYSQL_DATABASE=mini_app_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mini-java-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
