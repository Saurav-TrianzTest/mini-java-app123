version: '3.8'

services:
  mini-java-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mini-java-app:latest
    container_name: mini-java-app
    ports:
      - "8080:8080"
    environment:
      # Application configuration
      - SERVER_PORT=8080
      - SERVER_HOST=0.0.0.0
      - SPRING_PROFILES_ACTIVE=docker
      
      # JVM memory settings
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      
      # File paths (configurable)
      - CONFIG_DIR=/app/config
      - LOG_DIR=/app/logs
      - TEMP_DIR=/tmp/mini-app
      - UPLOAD_DIR=/app/uploads
      - CONFIG_PATH=/app/config/app.properties
      - LOG_FILE_PATH=/app/logs/mini-app.log
      
      # External database connection (to be provided separately)
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-mini_app_db}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-password123}
      
      # External Redis connection (to be provided separately)
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secret}
      
      # External API configuration
      - EXTERNAL_API_URL=${EXTERNAL_API_URL:-http://api.example.com:8080/v1}
      - EXTERNAL_API_KEY=${EXTERNAL_API_KEY:-api_key_placeholder}
      
      # Security configuration (override in production)
      - JWT_SECRET=${JWT_SECRET:-change_this_jwt_secret}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change_this_encryption_key}
      
      # Monitoring endpoint
      - MONITORING_URL=${MONITORING_URL:-http://monitoring:9090/metrics}
      
      # Timezone
      - TZ=UTC
    
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
      - ./uploads:/app/uploads
    
    networks:
      - app-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  app-network:
    driver: bridge
