version: "3.8"

services:
  mini-java-app:
    image: mini-java-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mini-java-app
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=${DB_HOST:-localhost}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-mini_app_db}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - REDIS_HOST=${REDIS_HOST:-redis-service}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - EXTERNAL_API_URL=${EXTERNAL_API_URL:-http://external-api-service/v1}
      - PAYMENT_SERVICE_URL=${PAYMENT_SERVICE_URL:-http://payment-service/process}
      - CONFIG_FILE_PATH=${CONFIG_FILE_PATH:-/app/config/app.properties}
      - LOG_FILE_PATH=${LOG_FILE_PATH:-/app/logs/mini-app.log}
      - LOG_DIR_PATH=${LOG_DIR_PATH:-/app/logs}
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
