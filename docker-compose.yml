version: '3.8'

services:
  mini-java-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mini-java-app:latest
    container_name: mini-java-app
    ports:
      - "8080:8080"
    environment:
      # Java JVM Options
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      
      # Application Configuration
      - APP_BASE_PATH=/app
      - SERVER_PORT=8080
      
      # Database Configuration (externalized - connect to external database)
      - DATABASE_URL=${DATABASE_URL:-jdbc:mysql://host.docker.internal:3306/mini_app_db}
      - DATABASE_USERNAME=${DATABASE_USERNAME:-root}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-password123}
      - DATABASE_DRIVER=${DATABASE_DRIVER:-com.mysql.cj.jdbc.Driver}
      - DATABASE_POOL_MAX_CONNECTIONS=${DATABASE_POOL_MAX_CONNECTIONS:-20}
      - DATABASE_POOL_TIMEOUT=${DATABASE_POOL_TIMEOUT:-5000}
      
      # Cache Configuration (externalized - connect to external Redis)
      - CACHE_REDIS_HOST=${CACHE_REDIS_HOST:-host.docker.internal}
      - CACHE_REDIS_PORT=${CACHE_REDIS_PORT:-6379}
      - CACHE_REDIS_PASSWORD=${CACHE_REDIS_PASSWORD:-redis_secret}
      - CACHE_REDIS_DATABASE=${CACHE_REDIS_DATABASE:-0}
      
      # External Service URLs
      - EXTERNAL_API_BASE_URL=${EXTERNAL_API_BASE_URL:-http://api.example.com:8080/v1}
      - EXTERNAL_API_TIMEOUT=${EXTERNAL_API_TIMEOUT:-30000}
      - EXTERNAL_API_KEY=${EXTERNAL_API_KEY:-api_key}
      
      # Payment Service Configuration
      - PAYMENT_SERVICE_URL=${PAYMENT_SERVICE_URL:-https://payment.internal.company.com/process}
      - PAYMENT_SERVICE_USERNAME=${PAYMENT_SERVICE_USERNAME:-payment_user}
      - PAYMENT_SERVICE_PASSWORD=${PAYMENT_SERVICE_PASSWORD:-payment_secret}
      
      # Security Configuration
      - SECURITY_JWT_SECRET=${SECURITY_JWT_SECRET:-jwt_secret_key}
      - SECURITY_ADMIN_USERNAME=${SECURITY_ADMIN_USERNAME:-admin}
      - SECURITY_ADMIN_PASSWORD=${SECURITY_ADMIN_PASSWORD:-admin123}
      - SECURITY_ENCRYPTION_KEY=${SECURITY_ENCRYPTION_KEY:-encryption_key}
      
      # Monitoring Configuration
      - MONITORING_ENDPOINT=${MONITORING_ENDPOINT:-http://monitoring.internal.company.com:9090/metrics}
      - MONITORING_USERNAME=${MONITORING_USERNAME:-monitor_user}
      - MONITORING_PASSWORD=${MONITORING_PASSWORD:-monitor_pass}
      
      # Messaging Configuration (externalized - connect to external RabbitMQ)
      - MESSAGING_RABBITMQ_HOST=${MESSAGING_RABBITMQ_HOST:-host.docker.internal}
      - MESSAGING_RABBITMQ_PORT=${MESSAGING_RABBITMQ_PORT:-5672}
      - MESSAGING_RABBITMQ_USERNAME=${MESSAGING_RABBITMQ_USERNAME:-rabbitmq_user}
      - MESSAGING_RABBITMQ_PASSWORD=${MESSAGING_RABBITMQ_PASSWORD:-rabbitmq_secret}
      
      # Environment Configuration
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG_ENABLED=${DEBUG_ENABLED:-false}
      - LOGGING_LEVEL=${LOGGING_LEVEL:-INFO}
      
      # Timezone
      - TZ=UTC
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  app-network:
    driver: bridge
