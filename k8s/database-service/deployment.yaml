apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-service
  namespace: default
  labels:
    app: database-service
    component: microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database-service
  template:
    metadata:
      labels:
        app: database-service
        component: microservice
    spec:
      containers:
        - name: database-service
          image: mini-java-app:latest
          ports:
            - containerPort: 8080
          envFrom:
            # Non-sensitive config from ConfigMap
            - configMapRef:
                name: database-service-config
          env:
            # Sensitive credentials from Kubernetes Secrets
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: database-service-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-service-secrets
                  key: DB_PASSWORD
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
