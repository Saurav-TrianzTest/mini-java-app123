# Azure App Service Deployment Configuration
# This file can be used with Azure CLI or Azure DevOps

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-java-app
  labels:
    app: mini-java-app
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mini-java-app
  template:
    metadata:
      labels:
        app: mini-java-app
        version: "1.0.0"
    spec:
      containers:
      - name: mini-java-app
        image: ${CONTAINER_REGISTRY}/mini-java-app:1.0.0
        ports:
        - containerPort: 8080
          name: http
        env:
        # Spring Profile
        - name: SPRING_PROFILES_ACTIVE
          value: "azure"
        
        # Database Configuration (from Azure Key Vault)
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: db-host
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "mini_app_db"
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: db-username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: db-password
        
        # Azure Key Vault
        - name: AZURE_KEYVAULT_URI
          value: "https://${KEYVAULT_NAME}.vault.azure.net/"
        
        # Azure App Configuration
        - name: AZURE_APPCONFIGURATION_ENDPOINT
          value: "https://${APPCONFIG_NAME}.azconfig.io"
        
        # Azure Blob Storage
        - name: AZURE_STORAGE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: storage-connection-string
        - name: AZURE_STORAGE_CONTAINER
          value: "app-data"
        - name: USE_BLOB_STORAGE
          value: "true"
        
        # Redis Cache
        - name: REDIS_HOST
          value: "${REDIS_NAME}.redis.cache.windows.net"
        - name: REDIS_PORT
          value: "6380"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: redis-password
        
        # Application Insights
        - name: APPINSIGHTS_INSTRUMENTATIONKEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: appinsights-key
        
        # Logging
        - name: LOG_LEVEL
          value: "INFO"
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30

---
apiVersion: v1
kind: Service
metadata:
  name: mini-java-app-service
  labels:
    app: mini-java-app
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: mini-java-app

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mini-java-app-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mini-java-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
