# Sample Application Configuration (Classpath Resource)
# This file is loaded from classpath as a fallback
# Production values should come from environment variables or GCP Secret Manager

# Application metadata
app.name=Mini Java Application
app.version=1.0.0
app.description=Cloud-ready Java application

# Feature flags (can be overridden by environment variables)
feature.cache.enabled=true
feature.monitoring.enabled=true
feature.metrics.enabled=true

# Default timeouts (can be overridden by environment variables)
default.connection.timeout=30000
default.read.timeout=60000
default.write.timeout=60000

# Retry configuration
retry.max.attempts=3
retry.backoff.delay=1000

# Circuit breaker configuration
circuit.breaker.failure.threshold=5
circuit.breaker.timeout=60000
