# Azure-specific configuration profile
# Activate this profile in Azure App Service by setting SPRING_PROFILES_ACTIVE=azure

# ============================================================================
# AZURE MANAGED IDENTITY CONFIGURATION
# ============================================================================
# Enable Managed Identity for secure access to Azure services
spring.cloud.azure.credential.managed-identity-enabled=true

# ============================================================================
# AZURE KEY VAULT INTEGRATION
# ============================================================================
# Enable Azure Key Vault for secrets management
spring.cloud.azure.keyvault.secret.enabled=true
spring.cloud.azure.keyvault.secret.endpoint=${AZURE_KEYVAULT_URI}
spring.cloud.azure.keyvault.secret.property-source-enabled=true

# ============================================================================
# AZURE APP CONFIGURATION
# ============================================================================
# Enable Azure App Configuration for centralized configuration
spring.cloud.azure.appconfiguration.enabled=true
spring.cloud.azure.appconfiguration.stores[0].endpoint=${AZURE_APPCONFIGURATION_ENDPOINT}
spring.cloud.azure.appconfiguration.stores[0].monitoring.enabled=true

# ============================================================================
# AZURE BLOB STORAGE
# ============================================================================
# Enable Azure Blob Storage for file operations
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER:app-data}
app.config.use-blob-storage=true

# ============================================================================
# AZURE APPLICATION INSIGHTS
# ============================================================================
# Enable Application Insights for monitoring
azure.application-insights.instrumentation-key=${APPINSIGHTS_INSTRUMENTATIONKEY:}
azure.application-insights.enabled=${APPINSIGHTS_ENABLED:true}

# ============================================================================
# AZURE DATABASE CONFIGURATION
# ============================================================================
# Use Azure Database for MySQL with SSL
spring.datasource.url=jdbc:mysql://${DB_HOST}.mysql.database.azure.com:3306/${DB_NAME}?useSSL=true&requireSSL=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}@${DB_HOST}
spring.datasource.password=${DB_PASSWORD}

# ============================================================================
# AZURE REDIS CACHE
# ============================================================================
# Use Azure Cache for Redis
cache.redis.host=${REDIS_HOST}.redis.cache.windows.net
cache.redis.port=6380
cache.redis.password=${REDIS_PASSWORD}
cache.redis.ssl=true

# ============================================================================
# CLOUD-NATIVE SETTINGS
# ============================================================================
# Enable health checks for Azure
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

# Enable graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ============================================================================
# LOGGING FOR AZURE
# ============================================================================
# Use JSON structured logging for Azure Monitor
logging.level.root=INFO
logging.level.com.test=INFO
logging.level.com.azure=INFO
