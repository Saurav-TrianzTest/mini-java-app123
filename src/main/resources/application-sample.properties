# Sample Configuration File - Copy to application.properties and configure with actual values
# DO NOT commit actual credentials to version control

# Server configuration
SERVER_PORT=8080
SERVER_HOST=localhost
SERVER_CONTEXT_PATH=/mini-app

# Database configuration
DB_URL=jdbc:mysql://localhost:3306/mini_app_db
DB_USERNAME=root
DB_PASSWORD=<your-database-password>

# Connection Pool configuration
DB_POOL_SIZE=20
DB_CONNECTION_TIMEOUT=30000
DB_POOL_MIN_IDLE=5
DB_IDLE_TIMEOUT=600000
DB_MAX_LIFETIME=1800000

# JPA configuration
JPA_SHOW_SQL=false

# Flyway configuration
FLYWAY_ENABLED=true

# Cache configuration
REDIS_HOST=localhost
REDIS_PORT=6379
REDIS_PASSWORD=<your-redis-password>
REDIS_DATABASE=0

# External service URLs
EXTERNAL_API_BASE_URL=http://api.example.com:8080/v1
EXTERNAL_API_TIMEOUT=30000
EXTERNAL_API_KEY=<your-api-key>

PAYMENT_SERVICE_URL=https://payment.internal.company.com/process
PAYMENT_SERVICE_USERNAME=<your-payment-username>
PAYMENT_SERVICE_PASSWORD=<your-payment-password>

# File paths
APP_CONFIG_DIR=./config
APP_LOG_DIR=./logs
APP_TEMP_DIR=./temp
APP_UPLOAD_DIR=./uploads

# Security configuration
JWT_SECRET=<your-jwt-secret>
ADMIN_USERNAME=admin
ADMIN_PASSWORD=<your-admin-password>
ENCRYPTION_KEY=<your-encryption-key>

# Monitoring/metrics
MONITORING_ENDPOINT=http://monitoring.internal.company.com:9090/metrics
MONITORING_USERNAME=<your-monitoring-username>
MONITORING_PASSWORD=<your-monitoring-password>

# Messaging configuration
RABBITMQ_HOST=localhost
RABBITMQ_PORT=5672
RABBITMQ_USERNAME=<your-rabbitmq-username>
RABBITMQ_PASSWORD=<your-rabbitmq-password>

# Environment configuration
ENVIRONMENT=development
DEBUG_ENABLED=true
LOGGING_LEVEL=INFO
APP_LOGGING_LEVEL=DEBUG

# Query timeout
DB_QUERY_TIMEOUT=30
