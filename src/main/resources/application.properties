# Cloud-Ready Mini Java App Configuration
# All sensitive values and environment-specific configurations are externalized to:
# - AWS Secrets Manager (for credentials and secrets)
# - AWS Systems Manager Parameter Store (for configuration parameters)
# - Environment Variables (for runtime configuration)

# Server configuration - externalized to environment variables and Parameter Store
# Use: SERVER_PORT environment variable or /mini-app/SERVER_PORT in Parameter Store
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:0.0.0.0}
server.context-path=${SERVER_CONTEXT_PATH:/mini-app}

# Database configuration - externalized to AWS Secrets Manager and Parameter Store
# Credentials stored in AWS Secrets Manager: mini-app/database/credentials
# Connection details in Parameter Store: /mini-app/DB_HOST, /mini-app/DB_PORT, /mini-app/DB_NAME
database.secret.name=${DB_SECRET_NAME:mini-app/database/credentials}
database.pool.max-size=${DB_POOL_MAX_SIZE:20}
database.pool.min-idle=${DB_POOL_MIN_IDLE:5}
database.query.timeout=${DB_QUERY_TIMEOUT:30}

# Cache configuration - externalized to Parameter Store
# Redis connection details in Parameter Store: /mini-app/REDIS_HOST, /mini-app/REDIS_PORT
cache.redis.enabled=${REDIS_ENABLED:true}

# External service URLs - externalized to Parameter Store
# API URLs in Parameter Store: /mini-app/EXTERNAL_API_URL, /mini-app/PAYMENT_SERVICE_URL
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}

# AWS S3 configuration for file storage
# Replaces local file system dependencies
aws.s3.config.bucket=${CONFIG_BUCKET:mini-app-config}
aws.s3.config.key=${CONFIG_KEY:config/app.properties}
aws.s3.log.bucket=${LOG_BUCKET:mini-app-logs}
aws.s3.log.key.prefix=${LOG_KEY_PREFIX:logs/}
aws.s3.upload.bucket=${UPLOAD_BUCKET:mini-app-uploads}

# AWS Region configuration
aws.region=${AWS_REGION:us-east-1}

# Security configuration - externalized to AWS Secrets Manager
# JWT secret in Secrets Manager: mini-app/security/jwt-secret
# Admin credentials in Secrets Manager: mini-app/security/admin-credentials
# Encryption key in Secrets Manager: mini-app/security/encryption-key
security.secret.jwt=${JWT_SECRET_NAME:mini-app/security/jwt-secret}
security.secret.admin=${ADMIN_SECRET_NAME:mini-app/security/admin-credentials}
security.secret.encryption=${ENCRYPTION_SECRET_NAME:mini-app/security/encryption-key}

# Monitoring configuration - externalized to Parameter Store
# Monitoring endpoint in Parameter Store: /mini-app/MONITORING_ENDPOINT
# Credentials in Secrets Manager: mini-app/monitoring/credentials
monitoring.enabled=${MONITORING_ENABLED:true}

# Messaging configuration - externalized to Parameter Store and Secrets Manager
# RabbitMQ connection details in Parameter Store: /mini-app/RABBITMQ_HOST, /mini-app/RABBITMQ_PORT
# RabbitMQ credentials in Secrets Manager: mini-app/messaging/rabbitmq-credentials
messaging.enabled=${MESSAGING_ENABLED:true}

# Environment configuration - externalized to environment variables
environment=${ENVIRONMENT:production}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOGGING_LEVEL:INFO}

# Cloud-native application settings
# Enable graceful shutdown for container orchestration
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Health check endpoints for cloud load balancers
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Connection timeout settings for cloud reliability
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# HTTP client timeout settings
http.client.connect-timeout=10000
http.client.read-timeout=30000
http.client.connection-request-timeout=5000
