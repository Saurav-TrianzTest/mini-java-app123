# Mini Java App Configuration - WITH INTENTIONAL CONTAINERIZATION BLOCKERS

# Fixed: Server configuration now uses environment variables
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:0.0.0.0}
server.context-path=/mini-app

# Fixed: Database configuration now uses environment variables
database.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mini_app_db}
database.username=${DB_USER:root}
database.password=${DB_PASSWORD:password123}
database.driver=com.mysql.cj.jdbc.Driver
database.pool.max-connections=20
database.pool.timeout=5000

# Fixed: Cache configuration now uses environment variables
cache.redis.host=${REDIS_HOST:127.0.0.1}
cache.redis.port=6379
cache.redis.password=redis_secret_123
cache.redis.database=0

# Fixed: External service URLs now use environment variables
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com:8080/v1}
external.api.timeout=30000
external.api.key=hardcoded_api_key_12345

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
payment.service.username=payment_user
payment.service.password=payment_secret_456

# Fixed: File paths now use environment variables
app.config.directory=${CONFIG_DIR:./config}
app.log.directory=${LOG_DIR:/var/log/mini-app}
app.temp.directory=${TEMP_DIR:/tmp/mini-app}
app.upload.directory=${UPLOAD_DIR:/data/uploads}

# BLOCKER: Hardcoded security configuration
security.jwt.secret=my_super_secret_jwt_key_123456789
security.admin.username=admin
security.admin.password=admin123
security.encryption.key=encryption_key_hardcoded

# Fixed: Monitoring/metrics endpoints now use environment variables
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com:9090/metrics}
monitoring.username=monitor_user
monitoring.password=monitor_pass

# Fixed: Messaging configuration now uses environment variables
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.internal.company.com}
messaging.rabbitmq.port=5672
messaging.rabbitmq.username=rabbitmq_user
