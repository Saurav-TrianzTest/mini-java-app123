# Mini Java App Configuration — cloud-ready version
#
# FIX cr-java-0070: This file no longer serves as the primary configuration source.
# All application configuration has been externalised to AWS Systems Manager
# Parameter Store. Properties are loaded at runtime via MiniApp.loadConfigFromParameterStore()
# using the path prefix defined by the SSM_CONFIG_PATH environment variable
# (default: /mini-app/config). This eliminates the immutable classpath bundle and
# enables runtime configuration changes without redeployment, following cloud-native
# externalized configuration principles (12-factor app, factor III).
#
# To configure the application, store parameters in AWS SSM Parameter Store under
# the path prefix /mini-app/config (or the value of SSM_CONFIG_PATH env var).
# Example SSM parameters:
#   /mini-app/config/server/port          -> 8080
#   /mini-app/config/server/host          -> 0.0.0.0
#   /mini-app/config/database/host        -> <rds-proxy-endpoint>
#   /mini-app/config/database/port        -> 3306
#   /mini-app/config/database/name        -> mini_app_db
#   /mini-app/config/cache/redis/host     -> <elasticache-endpoint>
#   /mini-app/config/cache/redis/port     -> 6379
#   /mini-app/config/external/api/host    -> api.example.com
#   /mini-app/config/external/api/port    -> 443
#   /mini-app/config/logging/level        -> INFO
#
# The environment variables below are used ONLY as fallback defaults when SSM
# Parameter Store is unavailable. Set SSM_CONFIG_PATH to point to the correct
# parameter path for each deployment environment (dev/staging/prod).

# FIX cr-java-0077: Server port is no longer hard-coded.
# The port is resolved at runtime from AWS SSM Parameter Store using the
# parameter name stored in SERVER_PORT_PARAM (default: /mini-app/server/port).
# Falls back to the SERVER_PORT environment variable (default: 8080).
# Set the following environment variables before starting the application:
#   SERVER_PORT_PARAM – SSM parameter name for server port
#                       (default: /mini-app/server/port)
#   SERVER_PORT       – fallback server port (default: 8080)
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:0.0.0.0}
server.context-path=/mini-app

# FIX cr-java-0069: Database credentials are no longer stored here.
# They are retrieved at runtime from AWS Secrets Manager using the secret
# identified by the DB_SECRET_NAME environment variable.
# Set the following environment variables before starting the application:
#   DB_SECRET_NAME  – name or ARN of the Secrets Manager secret
#                     (default: mini-app/db-credentials)
#   DB_HOST         – database hostname          (default: localhost)
#   DB_PORT         – database port              (default: 3306)
#   DB_NAME         – database schema/name       (default: mini_app_db)
#   AWS_REGION      – AWS region                 (default: us-east-1)
#
# The secret stored in AWS Secrets Manager must be a JSON object with at
# least the following keys:
#   { "username": "<db-user>", "password": "<db-password>" }
database.driver=com.mysql.cj.jdbc.Driver
database.pool.max-connections=${HIKARI_MAX_POOL_SIZE:10}
database.pool.timeout=${HIKARI_CONN_TIMEOUT_MS:30000}

# FIX cr-java-0077: Redis cache port is no longer hard-coded (was 6379).
# The port is resolved at runtime from AWS SSM Parameter Store using the
# parameter name stored in REDIS_PORT_PARAM (default: /mini-app/cache/redis-port).
# Falls back to the REDIS_PORT environment variable (default: 6379).
# Set the following environment variables before starting the application:
#   REDIS_HOST            – Redis hostname (default: 127.0.0.1)
#   REDIS_PORT_PARAM      – SSM parameter name for Redis port
#                           (default: /mini-app/cache/redis-port)
#   REDIS_PORT            – fallback Redis port (default: 6379)
cache.redis.host=${REDIS_HOST:127.0.0.1}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.port.ssm-param=${REDIS_PORT_PARAM:/mini-app/cache/redis-port}
cache.redis.password=${REDIS_PASSWORD:}
cache.redis.database=${REDIS_DATABASE:0}

# FIX cr-java-0077: External API port is no longer hard-coded (was 8080 in URL).
# The port is resolved at runtime from AWS SSM Parameter Store using the
# parameter name stored in EXTERNAL_API_PORT_PARAM
# (default: /mini-app/external-api/port).
# Falls back to the EXTERNAL_API_PORT environment variable (default: 8080).
# Set the following environment variables before starting the application:
#   EXTERNAL_API_HOST           – External API hostname (default: api.example.com)
#   EXTERNAL_API_PORT_PARAM     – SSM parameter name for external API port
#                                 (default: /mini-app/external-api/port)
#   EXTERNAL_API_PORT           – fallback external API port (default: 8080)
#   EXTERNAL_API_BASE_PATH      – External API base path (default: /v1)
external.api.host=${EXTERNAL_API_HOST:api.example.com}
external.api.port=${EXTERNAL_API_PORT:8080}
external.api.port.ssm-param=${EXTERNAL_API_PORT_PARAM:/mini-app/external-api/port}
external.api.base-path=${EXTERNAL_API_BASE_PATH:/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
external.api.key=${EXTERNAL_API_KEY:}

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
payment.service.username=${PAYMENT_SERVICE_USERNAME:}
payment.service.password=${PAYMENT_SERVICE_PASSWORD:}

# FIX cr-java-0070: File path configuration externalised to SSM Parameter Store.
# These values are no longer hardcoded — they are fetched from SSM at runtime
# under the path /mini-app/config/app/config-directory, etc.
# Environment variable fallbacks are provided for local development only.
app.config.directory=${APP_CONFIG_DIRECTORY:/opt/app/config}
app.log.directory=${APP_LOG_DIRECTORY:/var/log/mini-app}
app.temp.directory=${APP_TEMP_DIRECTORY:/tmp/mini-app}
app.upload.directory=${APP_UPLOAD_DIRECTORY:/opt/uploads}

# FIX cr-java-0070: Security configuration externalised to SSM Parameter Store
# (SecureString type) and AWS Secrets Manager. These values must NOT be stored
# in this file for production deployments. Use SSM SecureString parameters or
# AWS Secrets Manager secrets instead:
#   /mini-app/config/security/jwt-secret      (SSM SecureString)
#   /mini-app/config/security/admin-username  (SSM SecureString)
#   /mini-app/config/security/admin-password  (SSM SecureString)
#   /mini-app/config/security/encryption-key  (SSM SecureString)
security.jwt.secret=${SECURITY_JWT_SECRET:}
security.admin.username=${SECURITY_ADMIN_USERNAME:}
security.admin.password=${SECURITY_ADMIN_PASSWORD:}
security.encryption.key=${SECURITY_ENCRYPTION_KEY:}

# FIX cr-java-0077: Monitoring endpoint port is no longer hard-coded (was 9090).
# Externalised to environment variable.
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com:9090/metrics}
monitoring.username=${MONITORING_USERNAME:}
monitoring.password=${MONITORING_PASSWORD:}

# FIX cr-java-0077: RabbitMQ port is no longer hard-coded (was 5672).
# Externalised to environment variable.
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.internal.company.com}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${RABBITMQ_USERNAME:}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD:}

# FIX cr-java-0070: Environment-specific values externalised to SSM Parameter Store.
# Set /mini-app/config/environment, /mini-app/config/debug/enabled, and
# /mini-app/config/logging/level in SSM Parameter Store for each deployment environment.
environment=${APP_ENVIRONMENT:production}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOGGING_LEVEL:INFO}

# FIX cr-java-0070: SSM Parameter Store configuration path.
# All application configuration is loaded from this SSM path prefix at startup.
# Override SSM_CONFIG_PATH environment variable to use a different path per environment.
ssm.config.path=${SSM_CONFIG_PATH:/mini-app/config}
