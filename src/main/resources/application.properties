# Mini Java App Configuration - Cloud-Ready (AWS)
#
# All sensitive values and environment-specific settings have been removed
# from this file. They are now managed externally via:
#   - AWS Secrets Manager  : database credentials, API keys, encryption keys
#   - AWS SSM Parameter Store : host/port values, URLs, feature flags
#   - Environment variables : injected at runtime by ECS / EKS task definitions
#
# This file retains only non-sensitive, structural defaults that are safe
# to bundle with the application artifact.

# ---------------------------------------------------------------------------
# Server configuration
# Port is resolved at runtime from the SERVER_PORT environment variable or
# from SSM Parameter Store at /mini-app/server/port  (blocker-14/15)
# ---------------------------------------------------------------------------
server.context-path=/mini-app

# ---------------------------------------------------------------------------
# AWS region – override via AWS_REGION environment variable
# ---------------------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}

# ---------------------------------------------------------------------------
# S3 storage configuration (blocker-1/2/3/4/5/6/7)
# Bucket and key prefixes are injected via environment variables:
#   APP_S3_BUCKET, APP_S3_CONFIG_KEY, APP_S3_LOG_KEY_PREFIX
# ---------------------------------------------------------------------------
app.s3.bucket=${APP_S3_BUCKET:mini-app-storage}
app.s3.config-key=${APP_S3_CONFIG_KEY:config/app.properties}
app.s3.log-key-prefix=${APP_S3_LOG_KEY_PREFIX:logs/mini-app}

# ---------------------------------------------------------------------------
# Database configuration (blocker-8/9/10/11/12/13/16/17/18/19)
# Credentials are stored in AWS Secrets Manager under the secret name
# provided by the DB_SECRET_NAME environment variable.
# Host, port, and database name are stored in SSM Parameter Store under:
#   /mini-app/db/host, /mini-app/db/port, /mini-app/db/name
# ---------------------------------------------------------------------------
db.secret.name=${DB_SECRET_NAME:mini-app/db/credentials}
db.ssm.host.param=${SSM_DB_HOST_PARAM:/mini-app/db/host}
db.ssm.port.param=${SSM_DB_PORT_PARAM:/mini-app/db/port}
db.ssm.name.param=${SSM_DB_NAME_PARAM:/mini-app/db/name}

# HikariCP pool settings (blocker-17/18/19)
hikari.maximum-pool-size=20
hikari.minimum-idle=5
hikari.connection-timeout=30000
hikari.idle-timeout=600000
hikari.max-lifetime=1800000

# ---------------------------------------------------------------------------
# Cache configuration (blocker-11/12/13)
# Host and port are stored in SSM Parameter Store under:
#   /mini-app/cache/host, /mini-app/cache/port
# ---------------------------------------------------------------------------
cache.ssm.host.param=${SSM_REDIS_HOST_PARAM:/mini-app/cache/host}
cache.ssm.port.param=${SSM_REDIS_PORT_PARAM:/mini-app/cache/port}

# ---------------------------------------------------------------------------
# External service configuration (blocker-11/12/13)
# URLs are stored in SSM Parameter Store under:
#   /mini-app/external/api-url, /mini-app/external/payment-url
# ---------------------------------------------------------------------------
external.ssm.api-url.param=${SSM_EXTERNAL_API_URL_PARAM:/mini-app/external/api-url}
external.ssm.payment-url.param=${SSM_PAYMENT_SERVICE_URL_PARAM:/mini-app/external/payment-url}
external.api.timeout=30000

# ---------------------------------------------------------------------------
# Application configuration (blocker-20)
# Runtime configuration is loaded from SSM Parameter Store at:
#   /mini-app/app/config
# ---------------------------------------------------------------------------
app.ssm.config.param=${SSM_APP_CONFIG_PARAM:/mini-app/app/config}

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.test=INFO
