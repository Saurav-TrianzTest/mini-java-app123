# Mini Java App Configuration - CLOUD-READY VERSION
# All sensitive values should be provided via environment variables

# Cloud-ready: Server configuration from environment variables
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:0.0.0.0}
server.context-path=${SERVER_CONTEXT_PATH:/mini-app}

# Cloud-ready: Database configuration from environment variables
database.url=${DB_URL:jdbc:mysql://localhost:3306/mini_app_db}
database.username=${DB_USERNAME:root}
database.password=${DB_PASSWORD:}
database.driver=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
database.pool.max-connections=${DB_POOL_MAX_SIZE:20}
database.pool.timeout=${DB_CONNECTION_TIMEOUT:5000}

# Cloud-ready: Cache configuration from environment variables
cache.redis.host=${REDIS_HOST:localhost}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=${REDIS_PASSWORD:}
cache.redis.database=${REDIS_DATABASE:0}

# Cloud-ready: External service URLs from environment variables
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com:8080/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
external.api.key=${EXTERNAL_API_KEY:}

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
payment.service.username=${PAYMENT_SERVICE_USERNAME:}
payment.service.password=${PAYMENT_SERVICE_PASSWORD:}

# Cloud-ready: No hardcoded file paths - use classpath resources or cloud storage
# Configuration files should be embedded in the container image or loaded from cloud config services
app.config.directory=${APP_CONFIG_DIR:/config}
app.log.directory=${APP_LOG_DIR:/logs}
app.temp.directory=${APP_TEMP_DIR:/tmp}
app.upload.directory=${APP_UPLOAD_DIR:/uploads}

# Cloud-ready: Security configuration from environment variables or secrets manager
security.jwt.secret=${JWT_SECRET:}
security.admin.username=${ADMIN_USERNAME:admin}
security.admin.password=${ADMIN_PASSWORD:}
security.encryption.key=${ENCRYPTION_KEY:}

# Cloud-ready: Monitoring/metrics from environment variables
monitoring.endpoint=${MONITORING_ENDPOINT:http://localhost:9090/metrics}
monitoring.username=${MONITORING_USERNAME:}
monitoring.password=${MONITORING_PASSWORD:}

# Cloud-ready: Messaging configuration from environment variables
messaging.rabbitmq.host=${RABBITMQ_HOST:localhost}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${RABBITMQ_USERNAME:guest}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Cloud-ready: Environment-specific configuration from environment variables
environment=${ENVIRONMENT:development}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOGGING_LEVEL:INFO}

# AWS-specific configuration for cloud deployment
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:}
aws.rds.endpoint=${AWS_RDS_ENDPOINT:}
aws.elasticache.endpoint=${AWS_ELASTICACHE_ENDPOINT:}
