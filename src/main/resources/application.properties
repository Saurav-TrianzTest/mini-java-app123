# Mini Java App Configuration - Cloud-Ready Version
# All sensitive values and environment-specific configurations are externalized

# Server configuration - from environment variables or AWS Parameter Store
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:0.0.0.0}
server.context-path=${SERVER_CONTEXT_PATH:/mini-app}

# Database configuration - from AWS Secrets Manager
# Credentials are retrieved programmatically from Secrets Manager
database.secret.name=${DB_SECRET_NAME:mini-app/database/credentials}
database.pool.max-connections=${DB_POOL_MAX_CONNECTIONS:20}
database.pool.timeout=${DB_POOL_TIMEOUT:30000}
database.connection.timeout=${DB_CONNECTION_TIMEOUT:30000}

# Cache configuration - from AWS Parameter Store
cache.redis.host=${REDIS_HOST:localhost}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.database=${REDIS_DATABASE:0}
# Redis password from Secrets Manager
cache.redis.secret.name=${REDIS_SECRET_NAME:mini-app/redis/credentials}

# External service URLs - from AWS Parameter Store
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
# API key from Secrets Manager
external.api.secret.name=${EXTERNAL_API_SECRET_NAME:mini-app/external-api/key}

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.example.com/process}
# Payment credentials from Secrets Manager
payment.service.secret.name=${PAYMENT_SERVICE_SECRET_NAME:mini-app/payment-service/credentials}

# AWS S3 configuration for file storage
app.s3.bucket.name=${S3_BUCKET_NAME:mini-app-config-bucket}
app.s3.config.key=${CONFIG_S3_KEY:config/app.properties}
app.s3.log.key.prefix=${LOG_S3_KEY_PREFIX:logs/}
app.s3.upload.key.prefix=${UPLOAD_S3_KEY_PREFIX:uploads/}

# AWS configuration
aws.region=${AWS_REGION:us-east-1}
aws.secrets.manager.enabled=${AWS_SECRETS_ENABLED:true}
aws.parameter.store.enabled=${AWS_PARAMETER_STORE_ENABLED:true}

# Security configuration - from AWS Secrets Manager
# JWT secret, encryption keys, and admin credentials are retrieved from Secrets Manager
security.secret.name=${SECURITY_SECRET_NAME:mini-app/security/credentials}

# Monitoring/metrics endpoints - from AWS Parameter Store
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.example.com:9090/metrics}
# Monitoring credentials from Secrets Manager
monitoring.secret.name=${MONITORING_SECRET_NAME:mini-app/monitoring/credentials}

# Messaging configuration - from AWS Parameter Store
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.example.com}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
# RabbitMQ credentials from Secrets Manager
messaging.rabbitmq.secret.name=${RABBITMQ_SECRET_NAME:mini-app/rabbitmq/credentials}

# Environment configuration
environment=${ENVIRONMENT:production}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOGGING_LEVEL:INFO}

# Connection timeout settings for cloud resilience
http.connection.timeout=${HTTP_CONNECTION_TIMEOUT:30000}
http.read.timeout=${HTTP_READ_TIMEOUT:30000}
http.write.timeout=${HTTP_WRITE_TIMEOUT:30000}

# HikariCP connection pool settings
hikari.maximum.pool.size=${HIKARI_MAX_POOL_SIZE:20}
hikari.minimum.idle=${HIKARI_MIN_IDLE:5}
hikari.connection.timeout=${HIKARI_CONNECTION_TIMEOUT:30000}
hikari.idle.timeout=${HIKARI_IDLE_TIMEOUT:600000}
hikari.max.lifetime=${HIKARI_MAX_LIFETIME:1800000}
