# Mini Java App Configuration - Cloud Ready Version
# All values use environment variables with sensible defaults

# Cloud-ready: Server configuration from environment variables
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:0.0.0.0}
server.context-path=${SERVER_CONTEXT_PATH:/mini-app}

# Cloud-ready: Database configuration from environment variables
database.url=${DB_URL:jdbc:mysql://localhost:3306/mini_app_db?useSSL=true&serverTimezone=UTC}
database.username=${DB_USERNAME:root}
database.password=${DB_PASSWORD:}
database.driver=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
database.pool.max-connections=${DB_POOL_MAX_SIZE:20}
database.pool.timeout=${DB_CONNECTION_TIMEOUT:30000}
database.pool.min-idle=${DB_POOL_MIN_IDLE:5}
database.pool.idle-timeout=${DB_IDLE_TIMEOUT:600000}
database.pool.max-lifetime=${DB_MAX_LIFETIME:1800000}

# Cloud-ready: Cache configuration from environment variables
cache.redis.host=${REDIS_HOST:localhost}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=${REDIS_PASSWORD:}
cache.redis.database=${REDIS_DATABASE:0}
cache.redis.timeout=${REDIS_TIMEOUT:5000}

# Cloud-ready: External service URLs from environment variables
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com:8080/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
external.api.key=${EXTERNAL_API_KEY:}

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
payment.service.username=${PAYMENT_SERVICE_USERNAME:}
payment.service.password=${PAYMENT_SERVICE_PASSWORD:}
payment.service.timeout=${PAYMENT_SERVICE_TIMEOUT:30000}

# Cloud-ready: Remove hardcoded file paths - use cloud storage or temp directories
app.temp.directory=${TEMP_DIR:/tmp}
app.work.directory=${WORK_DIR:/tmp/app-work}

# Cloud-ready: Security configuration from environment variables
security.jwt.secret=${JWT_SECRET:}
security.admin.username=${ADMIN_USERNAME:}
security.admin.password=${ADMIN_PASSWORD:}
security.encryption.key=${ENCRYPTION_KEY:}
security.session.timeout=${SESSION_TIMEOUT:3600}

# Cloud-ready: Monitoring/metrics endpoints from environment variables
monitoring.endpoint=${MONITORING_ENDPOINT:http://localhost:9090/metrics}
monitoring.username=${MONITORING_USERNAME:}
monitoring.password=${MONITORING_PASSWORD:}
monitoring.interval=${MONITORING_INTERVAL:60000}

# Cloud-ready: Messaging configuration from environment variables
messaging.rabbitmq.host=${RABBITMQ_HOST:localhost}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${RABBITMQ_USERNAME:}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD:}
messaging.rabbitmq.vhost=${RABBITMQ_VHOST:/}
messaging.rabbitmq.connection-timeout=${RABBITMQ_CONNECTION_TIMEOUT:30000}

# Cloud-ready: Environment-specific configuration from environment variables
environment=${ENVIRONMENT:development}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOG_LEVEL:INFO}
logging.format=${LOG_FORMAT:json}

# Cloud-ready: Health check and resilience configuration
health.check.enabled=${HEALTH_CHECK_ENABLED:true}
health.check.interval=${HEALTH_CHECK_INTERVAL:30000}
circuit.breaker.enabled=${CIRCUIT_BREAKER_ENABLED:true}
circuit.breaker.timeout=${CIRCUIT_BREAKER_TIMEOUT:5000}

# Cloud-ready: Application metadata from environment variables
app.name=${APP_NAME:mini-java-app}
app.version=${APP_VERSION:1.0.0}
app.instance.id=${INSTANCE_ID:unknown}