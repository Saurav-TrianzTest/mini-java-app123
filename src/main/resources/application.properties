# Cloud-Native Mini Java App Configuration
# All sensitive values are externalized to AWS Secrets Manager and Parameter Store
# Environment variables override these default values

# Server Configuration - Use environment variables
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:0.0.0.0}
server.context-path=${SERVER_CONTEXT_PATH:/mini-app}

# Database Configuration - Retrieved from AWS Secrets Manager
# Secret name: ${DB_SECRET_NAME:mini-app/database}
# These are fallback values for local development only
database.secret.name=${DB_SECRET_NAME:mini-app/database}
database.pool.max-connections=${DB_POOL_MAX_SIZE:20}
database.pool.min-idle=${DB_POOL_MIN_IDLE:5}
database.pool.timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

# Cache Configuration - Use environment variables or Parameter Store
cache.redis.host=${REDIS_HOST:localhost}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.database=${REDIS_DATABASE:0}
# Redis password retrieved from AWS Secrets Manager: mini-app/redis

# External Service URLs - Use environment variables or Parameter Store
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT_MS:30000}
# API key retrieved from AWS Secrets Manager: mini-app/external-api

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
# Payment credentials retrieved from AWS Secrets Manager: mini-app/payment-service

# S3 Storage Configuration - Replaces local file system
app.s3.bucket=${CONFIG_S3_BUCKET:mini-app-config}
app.s3.config.key=${CONFIG_S3_KEY:config/app.properties}
app.s3.region=${AWS_REGION:us-east-1}

# Logging Configuration - Console-based for cloud environments
logging.level=${LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.json={"timestamp":"%d{ISO8601}","level":"%level","logger":"%logger","message":"%msg","thread":"%thread"}%n

# Security Configuration - Retrieved from AWS Secrets Manager
# JWT secret: mini-app/jwt-secret
# Admin credentials: mini-app/admin-credentials
# Encryption key: mini-app/encryption-key
security.secret.jwt=${JWT_SECRET_NAME:mini-app/jwt-secret}
security.secret.admin=${ADMIN_SECRET_NAME:mini-app/admin-credentials}
security.secret.encryption=${ENCRYPTION_SECRET_NAME:mini-app/encryption-key}

# Monitoring Configuration - Use environment variables or Parameter Store
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com:9090/metrics}
# Monitoring credentials retrieved from AWS Secrets Manager: mini-app/monitoring

# Messaging Configuration - Use environment variables or Parameter Store
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.internal.company.com}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
# RabbitMQ credentials retrieved from AWS Secrets Manager: mini-app/rabbitmq

# Environment Configuration
environment=${ENVIRONMENT:production}
debug.enabled=${DEBUG_ENABLED:false}

# AWS Configuration
aws.region=${AWS_REGION:us-east-1}
aws.secrets.enabled=${AWS_SECRETS_ENABLED:true}
aws.parameter.store.enabled=${AWS_PARAMETER_STORE_ENABLED:true}

# Health Check Configuration
management.health.db.enabled=true
management.health.diskspace.enabled=false
management.endpoints.web.exposure.include=health,info,metrics
