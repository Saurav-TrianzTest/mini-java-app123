# Mini Java App Configuration - Cloud-Ready Version
# FIXED: All hardcoded values replaced with environment variable references
# Environment variables can be set in AWS ECS/EKS, Azure App Service, GCP Cloud Run, etc.

# ============================================================================
# SERVER CONFIGURATION - Cloud-Ready
# ============================================================================
# FIXED: Server port from environment variable (default: 8080)
server.port=${SERVER_PORT:8080}

# FIXED: Server host from environment variable (0.0.0.0 for containers)
server.host=${SERVER_HOST:0.0.0.0}

# FIXED: Context path from environment variable
server.context-path=${SERVER_CONTEXT_PATH:/mini-app}

# ============================================================================
# DATABASE CONFIGURATION - Cloud-Ready with HikariCP
# ============================================================================
# FIXED: Database URL from environment variables
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mini_app_db}?useSSL=${DB_USE_SSL:true}&serverTimezone=UTC

# FIXED: Database credentials from environment variables
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}

# FIXED: Database driver
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# ============================================================================
# HIKARICP CONNECTION POOL CONFIGURATION - Cloud-Ready
# ============================================================================
# FIXED: Connection pool settings from environment variables
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}
spring.datasource.hikari.pool-name=MiniAppHikariPool
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1

# ============================================================================
# CACHE CONFIGURATION - Cloud-Ready
# ============================================================================
# FIXED: Redis configuration from environment variables
# Use AWS ElastiCache, Azure Cache for Redis, or GCP Memorystore endpoints
cache.redis.host=${REDIS_HOST:localhost}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=${REDIS_PASSWORD:}
cache.redis.database=${REDIS_DATABASE:0}
cache.redis.timeout=${REDIS_TIMEOUT:5000}

# ============================================================================
# EXTERNAL SERVICE URLS - Cloud-Ready
# ============================================================================
# FIXED: External API configuration from environment variables
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
external.api.key=${EXTERNAL_API_KEY:}

# FIXED: Payment service configuration from environment variables
payment.service.url=${PAYMENT_SERVICE_URL:https://payment.example.com/process}
payment.service.username=${PAYMENT_SERVICE_USERNAME:}
payment.service.password=${PAYMENT_SERVICE_PASSWORD:}
payment.service.timeout=${PAYMENT_SERVICE_TIMEOUT:30000}

# ============================================================================
# FILE PATHS - Cloud-Ready (Use environment variables or cloud storage)
# ============================================================================
# FIXED: Configuration directory from environment variable
app.config.directory=${APP_CONFIG_DIRECTORY:classpath:/config}

# FIXED: Log directory from environment variable (use console logging in cloud)
app.log.directory=${APP_LOG_DIRECTORY:/tmp/logs}

# FIXED: Temp directory from environment variable
app.temp.directory=${APP_TEMP_DIRECTORY:/tmp/mini-app}

# FIXED: Upload directory from environment variable (use S3/Azure Blob/GCS in production)
app.upload.directory=${APP_UPLOAD_DIRECTORY:/tmp/uploads}

# ============================================================================
# SECURITY CONFIGURATION - Cloud-Ready
# ============================================================================
# FIXED: JWT secret from environment variable (use AWS Secrets Manager, Azure Key Vault, GCP Secret Manager)
security.jwt.secret=${JWT_SECRET:}

# FIXED: Admin credentials from environment variables
security.admin.username=${ADMIN_USERNAME:admin}
security.admin.password=${ADMIN_PASSWORD:}

# FIXED: Encryption key from environment variable
security.encryption.key=${ENCRYPTION_KEY:}

# ============================================================================
# MONITORING CONFIGURATION - Cloud-Ready
# ============================================================================
# FIXED: Monitoring endpoint from environment variables
monitoring.endpoint=${MONITORING_ENDPOINT:http://localhost:9090/metrics}
monitoring.username=${MONITORING_USERNAME:}
monitoring.password=${MONITORING_PASSWORD:}

# Enable Spring Boot Actuator for cloud health checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.db.enabled=true

# ============================================================================
# MESSAGING CONFIGURATION - Cloud-Ready
# ============================================================================
# FIXED: RabbitMQ configuration from environment variables
# Use AWS MQ, Azure Service Bus, or GCP Pub/Sub in production
messaging.rabbitmq.host=${RABBITMQ_HOST:localhost}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${RABBITMQ_USERNAME:guest}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ============================================================================
# ENVIRONMENT CONFIGURATION - Cloud-Ready
# ============================================================================
# FIXED: Environment from environment variable
app.environment=${APP_ENVIRONMENT:development}

# FIXED: Debug mode from environment variable
app.debug.enabled=${DEBUG_ENABLED:false}

# FIXED: Logging level from environment variable
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.test=${APP_LOG_LEVEL:INFO}

# Cloud-native logging format (JSON for structured logging)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ============================================================================
# CLOUD DEPLOYMENT NOTES
# ============================================================================
# For AWS ECS/EKS: Set environment variables in task definition or ConfigMap
# For Azure App Service: Set in Application Settings
# For GCP Cloud Run: Set in container environment variables
# For Kubernetes: Use ConfigMaps and Secrets
# For Docker: Use docker-compose.yml or docker run -e flags
