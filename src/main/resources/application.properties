# Mini Java App Configuration — Cloud-Ready (AWS)
# All sensitive values have been externalised to AWS Secrets Manager and
# AWS Systems Manager (SSM) Parameter Store.
# Non-sensitive defaults are kept here; override via environment variables
# or SSM at runtime without redeployment (blocker-20).

# ---------------------------------------------------------------------------
# Server configuration
# blocker-14, blocker-15: port resolved from env var SERVER_PORT or SSM
# ---------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:0.0.0.0}
server.context-path=/mini-app

# ---------------------------------------------------------------------------
# Database configuration
# blocker-8,9,10,16,17,18: credentials fetched from AWS Secrets Manager at
#   runtime using the secret name defined by DB_SECRET_NAME env var.
# blocker-11,12,13: port fetched from SSM Parameter Store /mini-app/db/port
# ---------------------------------------------------------------------------
# Secret name in AWS Secrets Manager (JSON: username, password, host, dbname)
db.secret.name=${DB_SECRET_NAME:mini-app/db-credentials}
# SSM parameter path for the DB port
db.port.param=${DB_PORT_PARAM_NAME:/mini-app/db/port}
# HikariCP pool settings (non-sensitive)
database.pool.max-connections=20
database.pool.connection-timeout=30000
database.pool.idle-timeout=600000
database.pool.max-lifetime=1800000

# ---------------------------------------------------------------------------
# Cache configuration
# blocker-11,12,13: Redis port fetched from SSM /mini-app/redis/port
# ---------------------------------------------------------------------------
cache.redis.host=${REDIS_HOST:127.0.0.1}
cache.redis.port.param=${REDIS_PORT_PARAM_NAME:/mini-app/redis/port}
# Redis password stored in AWS Secrets Manager — do NOT hard-code here
cache.redis.secret.name=${REDIS_SECRET_NAME:mini-app/redis-credentials}
cache.redis.database=0

# ---------------------------------------------------------------------------
# External service URLs
# blocker-11,12,13: URLs fetched from SSM Parameter Store at runtime
# ---------------------------------------------------------------------------
external.api.url.param=${EXTERNAL_API_PARAM_NAME:/mini-app/external-api/url}
external.api.timeout=30000
# API key stored in AWS Secrets Manager — do NOT hard-code here
external.api.secret.name=${EXTERNAL_API_SECRET_NAME:mini-app/external-api-key}

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
# Payment credentials stored in AWS Secrets Manager — do NOT hard-code here
payment.service.secret.name=${PAYMENT_SECRET_NAME:mini-app/payment-credentials}

# ---------------------------------------------------------------------------
# File / storage configuration
# blocker-1,2,3,4,5,6,7: local file paths replaced with S3 bucket/key config
# ---------------------------------------------------------------------------
app.s3.bucket=${APP_S3_BUCKET:mini-app-storage}
app.s3.config.key=${CONFIG_S3_KEY:config/app.properties}
app.s3.log.key.prefix=${LOG_S3_KEY_PREFIX:logs/mini-app}

# ---------------------------------------------------------------------------
# SSM Parameter Store path prefix for application configuration
# blocker-20: replaces classpath-bundled properties
# ---------------------------------------------------------------------------
app.ssm.config.path=${SSM_CONFIG_PATH:/mini-app/config}

# ---------------------------------------------------------------------------
# Security configuration
# blocker-16: all secrets stored in AWS Secrets Manager — do NOT hard-code
# ---------------------------------------------------------------------------
security.jwt.secret.name=${JWT_SECRET_NAME:mini-app/jwt-secret}
security.admin.secret.name=${ADMIN_SECRET_NAME:mini-app/admin-credentials}
security.encryption.secret.name=${ENCRYPTION_SECRET_NAME:mini-app/encryption-key}

# ---------------------------------------------------------------------------
# Monitoring / metrics
# ---------------------------------------------------------------------------
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com:9090/metrics}
monitoring.secret.name=${MONITORING_SECRET_NAME:mini-app/monitoring-credentials}

# ---------------------------------------------------------------------------
# Messaging configuration
# ---------------------------------------------------------------------------
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.internal.company.com}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.secret.name=${RABBITMQ_SECRET_NAME:mini-app/rabbitmq-credentials}

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
environment=${APP_ENV:production}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOG_LEVEL:INFO}

# ---------------------------------------------------------------------------
# AWS SDK configuration
# ---------------------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}
