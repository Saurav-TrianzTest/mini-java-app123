# Mini Java App Configuration - Cloud-Ready Version
# FIXED: All hardcoded values replaced with environment variable placeholders
# These properties can be overridden by AWS Systems Manager Parameter Store or environment variables

# FIXED: Server configuration using environment variables
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:0.0.0.0}
server.context-path=${SERVER_CONTEXT_PATH:/mini-app}

# FIXED: Database configuration - credentials from AWS Secrets Manager
# Use AWS Secrets Manager or environment variables to provide these values
database.url=${DB_URL:jdbc:mysql://localhost:3306/mini_app_db}
database.username=${DB_USERNAME:app_user}
database.password=${DB_PASSWORD}
database.driver=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
database.pool.max-connections=${DB_POOL_MAX_CONNECTIONS:20}
database.pool.timeout=${DB_POOL_TIMEOUT:5000}

# FIXED: Cache configuration - from environment variables
cache.redis.host=${REDIS_HOST:localhost}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=${REDIS_PASSWORD}
cache.redis.database=${REDIS_DATABASE:0}

# FIXED: External service URLs - from AWS Parameter Store
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
external.api.key=${EXTERNAL_API_KEY}

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.example.com/process}
payment.service.username=${PAYMENT_SERVICE_USERNAME}
payment.service.password=${PAYMENT_SERVICE_PASSWORD}

# FIXED: File paths - removed absolute paths, use environment variables
# For cloud deployments, use S3 or EFS instead of local file system
app.config.directory=${APP_CONFIG_DIR:/config}
app.log.directory=${APP_LOG_DIR:/logs}
app.temp.directory=${APP_TEMP_DIR:/tmp}
app.upload.directory=${APP_UPLOAD_DIR:/uploads}

# FIXED: Security configuration - secrets from AWS Secrets Manager
security.jwt.secret=${JWT_SECRET}
security.admin.username=${ADMIN_USERNAME}
security.admin.password=${ADMIN_PASSWORD}
security.encryption.key=${ENCRYPTION_KEY}

# FIXED: Monitoring/metrics endpoints - from environment variables
monitoring.endpoint=${MONITORING_ENDPOINT:http://localhost:9090/metrics}
monitoring.username=${MONITORING_USERNAME}
monitoring.password=${MONITORING_PASSWORD}

# FIXED: Messaging configuration - from environment variables
messaging.rabbitmq.host=${RABBITMQ_HOST:localhost}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${RABBITMQ_USERNAME}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD}

# FIXED: Environment-specific values from environment variables
environment=${ENVIRONMENT:development}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOG_LEVEL:INFO}

# Cloud-specific configuration
cloud.aws.region=${AWS_REGION:us-east-1}
cloud.aws.secrets.enabled=${AWS_SECRETS_ENABLED:true}
cloud.aws.parameter-store.enabled=${AWS_PARAMETER_STORE_ENABLED:true}

# Application metadata
app.name=${APP_NAME:mini-java-app}
app.version=${APP_VERSION:1.0.0}
app.instance.id=${INSTANCE_ID:local}