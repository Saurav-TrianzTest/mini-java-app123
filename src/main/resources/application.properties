# Cloud-Ready Mini Java App Configuration
# All sensitive values and environment-specific configurations are externalized

# Server configuration - uses environment variables
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:0.0.0.0}
server.context-path=${SERVER_CONTEXT_PATH:/mini-app}

# Database configuration - uses AWS Secrets Manager and Parameter Store
# These are fallback values only; production uses AWS services
database.url=${DB_URL:jdbc:mysql://localhost:3306/mini_app_db}
database.username=${DB_USERNAME:}
database.password=${DB_PASSWORD:}
database.driver=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
database.pool.max-connections=${DB_POOL_MAX_CONNECTIONS:20}
database.pool.timeout=${DB_POOL_TIMEOUT:5000}

# HikariCP connection pool settings
hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:30000}
hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:600000}
hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}

# Cache configuration - uses AWS Parameter Store
cache.redis.host=${REDIS_HOST:localhost}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=${REDIS_PASSWORD:}
cache.redis.database=${REDIS_DATABASE:0}

# External service URLs - uses AWS Parameter Store
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com:8080/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
external.api.key=${EXTERNAL_API_KEY:}

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
payment.service.username=${PAYMENT_SERVICE_USERNAME:}
payment.service.password=${PAYMENT_SERVICE_PASSWORD:}

# AWS S3 configuration for file storage
aws.s3.bucket-name=${S3_BUCKET_NAME:mini-app-config-bucket}
aws.s3.config-key=${CONFIG_S3_KEY:config/app.properties}
aws.s3.log-key-prefix=${LOG_S3_KEY_PREFIX:logs/}
aws.region=${AWS_REGION:us-east-1}

# AWS Secrets Manager configuration
aws.secrets.database=${DB_SECRET_NAME:mini-app/database}
aws.secrets.redis=${REDIS_SECRET_NAME:mini-app/redis}
aws.secrets.external-api=${EXTERNAL_API_SECRET_NAME:mini-app/external-api}

# AWS Systems Manager Parameter Store paths
aws.ssm.database.host=${DB_HOST_PARAM:/mini-app/database/host}
aws.ssm.database.port=${DB_PORT_PARAM:/mini-app/database/port}
aws.ssm.database.name=${DB_NAME_PARAM:/mini-app/database/name}
aws.ssm.redis.host=${REDIS_HOST_PARAM:/mini-app/redis/host}
aws.ssm.redis.port=${REDIS_PORT_PARAM:/mini-app/redis/port}
aws.ssm.server.port=${SERVER_PORT_PARAM:/mini-app/server/port}

# Security configuration - uses AWS Secrets Manager
security.jwt.secret=${JWT_SECRET:}
security.admin.username=${ADMIN_USERNAME:}
security.admin.password=${ADMIN_PASSWORD:}
security.encryption.key=${ENCRYPTION_KEY:}

# Monitoring/metrics endpoints - uses environment variables
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com:9090/metrics}
monitoring.username=${MONITORING_USERNAME:}
monitoring.password=${MONITORING_PASSWORD:}

# Messaging configuration - uses AWS Parameter Store
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.internal.company.com}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${RABBITMQ_USERNAME:}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD:}

# Environment configuration - uses environment variables
environment=${APP_ENVIRONMENT:development}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOGGING_LEVEL:INFO}

# Connection timeout settings for cloud environments
connection.timeout.default=${CONNECTION_TIMEOUT:30000}
connection.timeout.read=${READ_TIMEOUT:30000}
connection.timeout.write=${WRITE_TIMEOUT:30000}

# Async operation settings
async.core-pool-size=${ASYNC_CORE_POOL_SIZE:10}
async.max-pool-size=${ASYNC_MAX_POOL_SIZE:50}
async.queue-capacity=${ASYNC_QUEUE_CAPACITY:100}
