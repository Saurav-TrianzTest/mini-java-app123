# Mini Java App Configuration — Cloud-Ready (AWS)
#
# All sensitive values and environment-specific settings have been removed from
# this file. They are now managed externally via:
#   - AWS Secrets Manager  : database credentials, API keys, passwords
#   - AWS SSM Parameter Store : ports, URLs, non-secret configuration
#   - Environment variables : AWS_REGION, APP_S3_BUCKET, SERVER_PORT, etc.
#
# This file retains only non-sensitive, structural defaults that are safe to
# bundle with the application. Override any value at runtime via the above
# external configuration sources.

# -----------------------------------------------------------------------
# Server — port is resolved at runtime from SSM Parameter Store or
# the SERVER_PORT environment variable (blocker-14, blocker-15)
# -----------------------------------------------------------------------
server.context-path=/mini-app

# -----------------------------------------------------------------------
# AWS region — override via AWS_REGION environment variable
# -----------------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}

# -----------------------------------------------------------------------
# Amazon S3 storage — replaces hard-coded file paths (blocker-1 to blocker-7)
# Override via APP_S3_BUCKET / CONFIG_S3_KEY / LOG_S3_KEY env vars
# -----------------------------------------------------------------------
app.s3.bucket=${APP_S3_BUCKET:mini-app-storage}
app.s3.config-key=${CONFIG_S3_KEY:config/app.properties}
app.s3.log-key=${LOG_S3_KEY:logs/mini-app.log}

# -----------------------------------------------------------------------
# AWS Secrets Manager — secret names (blocker-8,9,10,16)
# Override via DB_SECRET_NAME env var
# -----------------------------------------------------------------------
app.secrets.db-secret-name=${DB_SECRET_NAME:mini-app/db-credentials}

# -----------------------------------------------------------------------
# AWS SSM Parameter Store — parameter paths (blocker-11 to blocker-15, blocker-20)
# Override via corresponding env vars
# -----------------------------------------------------------------------
app.ssm.server-port-param=${SERVER_PORT_PARAM:/mini-app/server/port}
app.ssm.db-port-param=${DB_PORT_PARAM:/mini-app/db/port}
app.ssm.redis-port-param=${REDIS_PORT_PARAM:/mini-app/cache/redis/port}
app.ssm.config-param-path=${APP_CONFIG_PARAM_PATH:/mini-app/config/}

# -----------------------------------------------------------------------
# Connection pool defaults (blocker-17, blocker-18, blocker-19)
# -----------------------------------------------------------------------
app.db.pool.max-size=20
app.db.pool.min-idle=5
app.db.pool.connection-timeout-ms=30000
app.db.pool.idle-timeout-ms=600000
app.db.pool.max-lifetime-ms=1800000

# -----------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------
logging.level=INFO
