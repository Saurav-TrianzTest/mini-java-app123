# Mini Java App Configuration - externalized for containerization

# Server configuration - port from environment variable
server.port=${APP_PORT:8080}
server.host=${APP_HOST:localhost}
server.context-path=/mini-app

# Database configuration - credentials from environment/Secrets
database.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mini_app_db}
database.username=
database.password=
database.driver=com.mysql.cj.jdbc.Driver
database.pool.max-connections=20
database.pool.timeout=5000

# Cache configuration - host/port from environment variables
cache.redis.host=${REDIS_HOST:localhost}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=
cache.redis.database=0

# External service URLs - from environment variables
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com:8080/v1}
external.api.timeout=30000
external.api.key=

# Payment service URL - from environment variable
payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
payment.service.username=
payment.service.password=

# File paths - from environment variables
app.config.directory=${CONFIG_PATH:/app/config}
app.log.directory=${LOG_PATH:/app/logs}
app.temp.directory=${TEMP_PATH:/tmp/mini-app}
app.upload.directory=${UPLOAD_PATH:/app/uploads}

# Security configuration - secrets from environment/Secrets
security.jwt.secret=
security.admin.username=
security.admin.password=
security.encryption.key=

# Monitoring/metrics endpoints - from environment variables
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com:9090/metrics}
monitoring.username=
monitoring.password=

# Messaging configuration - from environment variables
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.internal.company.com}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=
messaging.rabbitmq.password=

# Environment-specific values
environment=${APP_ENV:production}
debug.enabled=false
logging.level=INFO
