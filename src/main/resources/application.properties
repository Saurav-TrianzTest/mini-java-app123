# Mini Java App Configuration - Cloud-Ready with Environment Variables

# Cloud-ready: Server configuration from environment variables
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:0.0.0.0}
server.context-path=${SERVER_CONTEXT_PATH:/mini-app}

# Cloud-ready: Database configuration from AWS Secrets Manager and Parameter Store
# These values should be retrieved from AWS Secrets Manager at runtime
database.url=${DATABASE_URL:jdbc:mysql://localhost:3306/mini_app_db}
database.username=${DB_USERNAME:root}
database.password=${DB_PASSWORD:changeme}
database.driver=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# Cloud-ready: HikariCP connection pool configuration
database.pool.max-connections=${DB_POOL_MAX_CONNECTIONS:20}
database.pool.min-idle=${DB_POOL_MIN_IDLE:5}
database.pool.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:30000}
database.pool.idle-timeout=${DB_POOL_IDLE_TIMEOUT:600000}
database.pool.max-lifetime=${DB_POOL_MAX_LIFETIME:1800000}

# Cloud-ready: Cache configuration from environment variables
cache.redis.host=${REDIS_HOST:127.0.0.1}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=${REDIS_PASSWORD:}
cache.redis.database=${REDIS_DATABASE:0}

# Cloud-ready: External service URLs from environment variables
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com:8080/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
external.api.key=${EXTERNAL_API_KEY:}

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
payment.service.username=${PAYMENT_SERVICE_USERNAME:}
payment.service.password=${PAYMENT_SERVICE_PASSWORD:}

# Cloud-ready: S3 configuration for file storage
app.s3.bucket-name=${S3_BUCKET_NAME:mini-app-config-bucket}
app.s3.config-key=${CONFIG_S3_KEY:config/app.properties}
app.s3.log-key-prefix=${LOG_S3_KEY_PREFIX:logs/}

# Cloud-ready: AWS configuration
aws.region=${AWS_REGION:us-east-1}
aws.secrets.database=${DB_SECRET_NAME:mini-app/database/credentials}
aws.parameter-store.db-host=${DB_HOST_PARAM:/mini-app/database/host}
aws.parameter-store.db-port=${DB_PORT_PARAM:/mini-app/database/port}
aws.parameter-store.app-config=${APP_CONFIG_PARAMETER:/mini-app/config}

# Cloud-ready: Security configuration from AWS Secrets Manager
# These should be retrieved from AWS Secrets Manager at runtime
security.jwt.secret=${JWT_SECRET:}
security.admin.username=${ADMIN_USERNAME:}
security.admin.password=${ADMIN_PASSWORD:}
security.encryption.key=${ENCRYPTION_KEY:}

# Cloud-ready: Monitoring/metrics endpoints from environment variables
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com:9090/metrics}
monitoring.username=${MONITORING_USERNAME:}
monitoring.password=${MONITORING_PASSWORD:}

# Cloud-ready: Messaging configuration from environment variables
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.internal.company.com}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${RABBITMQ_USERNAME:}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD:}

# Cloud-ready: Environment-specific configuration from environment variables
environment=${ENVIRONMENT:development}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOGGING_LEVEL:INFO}

# Cloud-ready: Query timeout configuration
query.timeout.seconds=${QUERY_TIMEOUT_SECONDS:30}

# Note: All sensitive values (passwords, API keys, secrets) should be stored in AWS Secrets Manager
# and retrieved at runtime. The placeholders above are for local development only.
