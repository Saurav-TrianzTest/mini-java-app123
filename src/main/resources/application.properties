# Mini Java App Configuration - Cloud-Ready Version
# All sensitive values and environment-specific configurations externalized

# FIXED: Server configuration using environment variables
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:0.0.0.0}
server.context-path=${SERVER_CONTEXT_PATH:/mini-app}

# FIXED: Database configuration using AWS Secrets Manager and Parameter Store
# Credentials retrieved from AWS Secrets Manager at runtime
# Connection details retrieved from AWS Systems Manager Parameter Store
database.secret.name=${DB_SECRET_NAME:mini-app/database/credentials}
database.host.parameter=${DB_HOST_PARAM:/mini-app/database/host}
database.port.parameter=${DB_PORT_PARAM:/mini-app/database/port}
database.name.parameter=${DB_NAME_PARAM:/mini-app/database/name}

# HikariCP connection pool configuration
database.pool.max-connections=${DB_POOL_MAX_CONNECTIONS:10}
database.pool.min-idle=${DB_POOL_MIN_IDLE:2}
database.pool.timeout=${DB_POOL_TIMEOUT:30000}
database.pool.idle-timeout=${DB_POOL_IDLE_TIMEOUT:600000}
database.pool.max-lifetime=${DB_POOL_MAX_LIFETIME:1800000}

# FIXED: Cache configuration using Parameter Store
cache.redis.host.parameter=${REDIS_HOST_PARAM:/mini-app/redis/host}
cache.redis.port.parameter=${REDIS_PORT_PARAM:/mini-app/redis/port}
cache.redis.password.secret=${REDIS_PASSWORD_SECRET:mini-app/redis/password}

# FIXED: External service URLs using Parameter Store
external.api.url.parameter=${EXTERNAL_API_URL_PARAM:/mini-app/external-api/url}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
external.api.key.secret=${EXTERNAL_API_KEY_SECRET:mini-app/external-api/key}

payment.service.url.parameter=${PAYMENT_SERVICE_URL_PARAM:/mini-app/payment-service/url}
payment.service.credentials.secret=${PAYMENT_SERVICE_SECRET:mini-app/payment-service/credentials}

# FIXED: File storage using Amazon S3
app.s3.bucket=${APP_S3_BUCKET}
app.s3.config.key=${APP_CONFIG_S3_KEY:config/app.properties}
app.s3.log.key=${APP_LOG_S3_KEY:logs/mini-app.log}
app.s3.temp.prefix=${APP_S3_TEMP_PREFIX:temp/}
app.s3.upload.prefix=${APP_S3_UPLOAD_PREFIX:uploads/}

# FIXED: Security configuration using AWS Secrets Manager
security.jwt.secret.name=${JWT_SECRET_NAME:mini-app/security/jwt-secret}
security.admin.credentials.secret=${ADMIN_CREDENTIALS_SECRET:mini-app/security/admin-credentials}
security.encryption.key.secret=${ENCRYPTION_KEY_SECRET:mini-app/security/encryption-key}

# FIXED: Monitoring/metrics endpoints using Parameter Store
monitoring.endpoint.parameter=${MONITORING_ENDPOINT_PARAM:/mini-app/monitoring/endpoint}
monitoring.credentials.secret=${MONITORING_CREDENTIALS_SECRET:mini-app/monitoring/credentials}

# FIXED: Messaging configuration using Parameter Store and Secrets Manager
messaging.rabbitmq.host.parameter=${RABBITMQ_HOST_PARAM:/mini-app/rabbitmq/host}
messaging.rabbitmq.port.parameter=${RABBITMQ_PORT_PARAM:/mini-app/rabbitmq/port}
messaging.rabbitmq.credentials.secret=${RABBITMQ_CREDENTIALS_SECRET:mini-app/rabbitmq/credentials}

# AWS Configuration
aws.region=${AWS_REGION:us-east-1}

# Environment configuration (externalized)
environment=${ENVIRONMENT:production}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOGGING_LEVEL:INFO}

# Cloud-native application settings
# Enable graceful shutdown for container orchestration
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Health check endpoints for cloud load balancers
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
