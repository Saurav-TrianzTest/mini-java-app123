# Mini Java App Configuration
# cr-java-0070: Classpath-bundled properties file has been replaced with
# AWS Systems Manager Parameter Store for externalized, runtime-configurable
# configuration.  All application parameters are stored as SSM parameters
# under the path prefix defined by SSM_PARAMETER_PATH (default: /mini-app/config).
# This file is retained only as a reference / local-development fallback;
# in cloud deployments all values are sourced from SSM Parameter Store at startup.

# cr-java-0077: Hard-coded port numbers have been replaced with environment
# variable references. At runtime, ECS task definitions, EKS pod specs, or
# Elastic Beanstalk environment properties inject these values from AWS Systems
# Manager Parameter Store, enabling dynamic port assignment and eliminating
# deployment conflicts.

# AWS Systems Manager Parameter Store path prefix (cr-java-0070)
ssm.parameter.path=${SSM_PARAMETER_PATH:/mini-app/config}

# Server configuration — port sourced from SERVER_PORT env var (AWS Parameter Store)
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:localhost}
server.context-path=/mini-app

# Database configuration — credentials sourced from AWS Secrets Manager (cr-java-0069)
database.url=${DATABASE_URL:jdbc:mysql://localhost:3306/mini_app_db}
database.username=${DATABASE_USERNAME:root}
database.password=${DATABASE_PASSWORD:}
database.driver=com.mysql.cj.jdbc.Driver

# cr-java-0073: HikariCP connection pool configuration
# When using Amazon RDS Proxy, set DB_PROXY_ENDPOINT to the RDS Proxy endpoint
# and keep pool sizes small — RDS Proxy multiplexes connections server-side.
spring.datasource.hikari.pool-name=MiniAppHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.connection-test-query=SELECT 1

# Amazon RDS Proxy endpoint (overrides host from Secrets Manager when set)
# Set DB_PROXY_ENDPOINT to the RDS Proxy endpoint DNS name in your AWS environment
db.proxy.endpoint=${DB_PROXY_ENDPOINT:}

# Cache configuration — host and port sourced from env vars (AWS Parameter Store)
# cr-java-0077: Replaced hard-coded REDIS_PORT=6379 with REDIS_PORT env var
cache.redis.host=${REDIS_HOST:127.0.0.1}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=${REDIS_PASSWORD:}
cache.redis.database=${REDIS_DATABASE:0}

# External service URLs — sourced from env vars (AWS Parameter Store)
# cr-java-0077: Replaced hard-coded port embedded in external.api.base-url with env var
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
external.api.key=${EXTERNAL_API_KEY:}

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
payment.service.username=${PAYMENT_SERVICE_USERNAME:}
payment.service.password=${PAYMENT_SERVICE_PASSWORD:}

# File/storage paths — sourced from env vars (S3 keys for cloud-native storage)
app.config.directory=${APP_CONFIG_DIRECTORY:/opt/app/config}
app.log.directory=${APP_LOG_DIRECTORY:/var/log/mini-app}
app.temp.directory=${APP_TEMP_DIRECTORY:/tmp/mini-app}
app.upload.directory=${APP_UPLOAD_DIRECTORY:/opt/uploads}

# Security configuration — sourced from AWS Secrets Manager / env vars
security.jwt.secret=${JWT_SECRET:}
security.admin.username=${ADMIN_USERNAME:}
security.admin.password=${ADMIN_PASSWORD:}
security.encryption.key=${ENCRYPTION_KEY:}

# Monitoring/metrics endpoints — sourced from env vars (AWS Parameter Store)
# cr-java-0077: Replaced hard-coded port in monitoring.endpoint with env var
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com/metrics}
monitoring.username=${MONITORING_USERNAME:}
monitoring.password=${MONITORING_PASSWORD:}

# Messaging configuration — sourced from env vars (AWS Parameter Store)
# cr-java-0077: Replaced hard-coded RABBITMQ_PORT=5672 with env var
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.internal.company.com}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${RABBITMQ_USERNAME:}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD:}

# Environment-specific values — sourced from env vars
environment=${APP_ENVIRONMENT:production}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOGGING_LEVEL:INFO}
