# Mini Java App Configuration - CLOUD-NATIVE FOR AWS DEPLOYMENT
# All sensitive values are externalized to AWS Secrets Manager and AWS Systems Manager Parameter Store
# Configuration values are loaded at runtime from environment variables

# ============================================================================
# CLOUD-NATIVE CONFIGURATION APPROACH
# ============================================================================
# This application uses the following AWS services for configuration:
# 1. AWS Secrets Manager - for database credentials, API keys, and sensitive data
# 2. AWS Systems Manager Parameter Store - for application configuration
# 3. Environment Variables - for runtime configuration injection
# 4. Amazon S3 - for file storage (replacing local file system)
# 5. HikariCP - for database connection pooling
# ============================================================================

# Server Configuration (from AWS Parameter Store or Environment Variables)
# Parameter Store path: /mini-app/server/port
# Environment variable: SERVER_PORT
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:0.0.0.0}
server.context-path=${SERVER_CONTEXT_PATH:/mini-app}

# Database Configuration (from AWS Secrets Manager)
# Secret name: mini-app/database (JSON format)
# Secret structure: {"username":"xxx","password":"xxx","host":"xxx","port":"xxx","dbname":"xxx"}
# Environment variable fallbacks: DB_USERNAME, DB_PASSWORD, DB_HOST, DB_PORT, DB_NAME
database.secret.name=${DB_SECRET_NAME:mini-app/database}

# HikariCP Connection Pool Configuration (from Parameter Store)
# Parameter Store paths: /mini-app/db/pool-size, /mini-app/db/min-idle, etc.
database.pool.max-connections=${DB_POOL_MAX_CONNECTIONS:20}
database.pool.min-idle=${DB_POOL_MIN_IDLE:5}
database.pool.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:30000}
database.pool.idle-timeout=${DB_POOL_IDLE_TIMEOUT:600000}
database.pool.max-lifetime=${DB_POOL_MAX_LIFETIME:1800000}
database.pool.query-timeout=${DB_QUERY_TIMEOUT:30}

# Cache Configuration (from Parameter Store)
# Parameter Store paths: /mini-app/redis/host, /mini-app/redis/port
# For production, use AWS ElastiCache for Redis
cache.redis.host=${REDIS_HOST:localhost}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.secret.name=${REDIS_SECRET_NAME:mini-app/redis}

# External Service URLs (from Parameter Store)
# Parameter Store paths: /mini-app/external-api/url, /mini-app/payment-service/url
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com:8080/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}

# Amazon S3 Configuration (replacing local file system)
# Parameter Store paths: /mini-app/s3/bucket-name, /mini-app/s3/config-key, /mini-app/s3/log-key
# Environment variables: S3_BUCKET_NAME, CONFIG_S3_KEY, LOG_S3_KEY
app.s3.bucket-name=${S3_BUCKET_NAME:mini-app-storage}
app.s3.config-key=${CONFIG_S3_KEY:config/app.properties}
app.s3.log-key=${LOG_S3_KEY:logs/mini-app.log}
app.s3.upload-prefix=${S3_UPLOAD_PREFIX:uploads/}

# AWS Region Configuration
aws.region=${AWS_REGION:us-east-1}

# Security Configuration (from AWS Secrets Manager)
# Secret names: mini-app/jwt-secret, mini-app/admin-credentials, mini-app/encryption-key
security.jwt.secret.name=${JWT_SECRET_NAME:mini-app/jwt-secret}
security.admin.secret.name=${ADMIN_SECRET_NAME:mini-app/admin-credentials}
security.encryption.secret.name=${ENCRYPTION_SECRET_NAME:mini-app/encryption-key}

# Monitoring Configuration (from Parameter Store)
# Parameter Store path: /mini-app/monitoring/endpoint
# For production, use AWS CloudWatch for metrics and logging
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com:9090/metrics}
monitoring.secret.name=${MONITORING_SECRET_NAME:mini-app/monitoring}

# Messaging Configuration (from Parameter Store and Secrets Manager)
# For production, use AWS SQS or Amazon MQ
# Parameter Store path: /mini-app/messaging/rabbitmq/host
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.internal.company.com}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.secret.name=${RABBITMQ_SECRET_NAME:mini-app/rabbitmq}

# Environment Configuration
environment=${ENVIRONMENT:production}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOGGING_LEVEL:INFO}

# ============================================================================
# AWS DEPLOYMENT NOTES
# ============================================================================
# 1. Create secrets in AWS Secrets Manager:
#    - mini-app/database (JSON with username, password, host, port, dbname)
#    - mini-app/redis (JSON with password)
#    - mini-app/jwt-secret (string)
#    - mini-app/admin-credentials (JSON with username, password)
#    - mini-app/encryption-key (string)
#
# 2. Create parameters in AWS Systems Manager Parameter Store:
#    - /mini-app/server/port
#    - /mini-app/db/pool-size, /mini-app/db/min-idle, etc.
#    - /mini-app/redis/host, /mini-app/redis/port
#    - /mini-app/external-api/url
#    - /mini-app/payment-service/url
#    - /mini-app/s3/bucket-name, /mini-app/s3/config-key, /mini-app/s3/log-key
#
# 3. Create S3 bucket for file storage:
#    - Bucket name from S3_BUCKET_NAME environment variable
#    - Enable versioning and encryption
#    - Configure lifecycle policies as needed
#
# 4. Configure IAM roles with permissions:
#    - secretsmanager:GetSecretValue for Secrets Manager
#    - ssm:GetParameter for Parameter Store
#    - s3:GetObject, s3:PutObject for S3 bucket
#
# 5. Set environment variables in ECS/EKS/Elastic Beanstalk:
#    - AWS_REGION
#    - DB_SECRET_NAME (optional, defaults to mini-app/database)
#    - S3_BUCKET_NAME
#    - SERVER_PORT (optional, can use Parameter Store)
# ============================================================================
