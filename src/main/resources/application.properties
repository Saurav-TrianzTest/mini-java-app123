# Mini Java App Configuration - Externalized Configuration

# Server configuration using environment variables
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:localhost}
server.context-path=${SERVER_CONTEXT_PATH:/mini-app}

# Spring DataSource configuration with environment variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mini_app_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool configuration
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway configuration
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Cache configuration using environment variables
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD}
spring.redis.database=${REDIS_DATABASE:0}

# External service URLs using environment variables
external.api.base-url=${EXTERNAL_API_BASE_URL:http://api.example.com:8080/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
external.api.key=${EXTERNAL_API_KEY}

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
payment.service.username=${PAYMENT_SERVICE_USERNAME}
payment.service.password=${PAYMENT_SERVICE_PASSWORD}

# File paths using environment variables
app.config.directory=${APP_CONFIG_DIR:./config}
app.log.directory=${APP_LOG_DIR:./logs}
app.temp.directory=${APP_TEMP_DIR:./temp}
app.upload.directory=${APP_UPLOAD_DIR:./uploads}

# Security configuration using environment variables
security.jwt.secret=${JWT_SECRET}
security.admin.username=${ADMIN_USERNAME:admin}
security.admin.password=${ADMIN_PASSWORD}
security.encryption.key=${ENCRYPTION_KEY}

# Monitoring/metrics endpoints using environment variables
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com:9090/metrics}
monitoring.username=${MONITORING_USERNAME}
monitoring.password=${MONITORING_PASSWORD}

# Messaging configuration using environment variables
messaging.rabbitmq.host=${RABBITMQ_HOST:localhost}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${RABBITMQ_USERNAME}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD}

# Environment-specific values using environment variables
environment=${ENVIRONMENT:development}
debug.enabled=${DEBUG_ENABLED:false}
logging.level.root=${LOGGING_LEVEL:INFO}
logging.level.com.test=${APP_LOGGING_LEVEL:DEBUG}

# Query timeout configuration
db.query.timeout=${DB_QUERY_TIMEOUT:30}