# =============================================================================
# Mini Java App — Bootstrap Configuration (Cloud-Ready / AWS)
# =============================================================================
#
# REMEDIATION (cr-java-0070 — Properties Files in Classpath):
# All application configuration has been externalised from this classpath-
# bundled file to AWS Systems Manager (SSM) Parameter Store.
#
# This file now contains ONLY the minimal bootstrap properties required to
# locate the SSM Parameter Store path at startup.  All other configuration
# (server settings, database connection, cache, external services, security,
# monitoring, messaging) is stored in AWS SSM Parameter Store and fetched
# at runtime by the application, enabling:
#
#   - Runtime configuration changes without redeployment.
#   - Environment-specific values (dev / staging / prod) via different
#     SSM path prefixes.
#   - Fine-grained access control via AWS IAM policies.
#   - Transparent decryption of SecureString parameters via AWS KMS.
#
# HOW TO SUPPLY CONFIGURATION AT RUNTIME
# ─────────────────────────────────────────────────────────────────────────────
# 1. Store each configuration value as an SSM Parameter under the path prefix
#    defined by SSM_PARAMETER_PATH (default: /mini-app/config), for example:
#
#      /mini-app/config/server.port          → 8080
#      /mini-app/config/database.url         → jdbc:mysql://...
#      /mini-app/config/cache.redis.host     → my-redis.cache.amazonaws.com
#
# 2. Set the SSM_PARAMETER_PATH environment variable in the ECS task
#    definition, EKS pod spec, or Elastic Beanstalk environment properties
#    to switch between environments without any code or artifact changes:
#
#      SSM_PARAMETER_PATH=/mini-app/dev/config     (development)
#      SSM_PARAMETER_PATH=/mini-app/staging/config (staging)
#      SSM_PARAMETER_PATH=/mini-app/prod/config    (production)
#
# 3. Ensure the ECS task role / EC2 instance profile / EKS service account
#    has the following IAM permissions on the parameter path:
#
#      ssm:GetParametersByPath
#      ssm:GetParameter
#      kms:Decrypt  (required for SecureString parameters)
# ─────────────────────────────────────────────────────────────────────────────

# ---------------------------------------------------------------------------
# Bootstrap: SSM Parameter Store path prefix
# All runtime configuration is loaded from this SSM path at application startup.
# Override via the SSM_PARAMETER_PATH environment variable.
# ---------------------------------------------------------------------------
app.ssm.parameter-path=${SSM_PARAMETER_PATH:/mini-app/config}

# ---------------------------------------------------------------------------
# Bootstrap: AWS region
# Required to initialise the SSM client before any other configuration is
# available.  Override via the AWS_REGION environment variable.
# ---------------------------------------------------------------------------
app.aws.region=${AWS_REGION:us-east-1}
