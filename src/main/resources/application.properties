# Mini Java App Configuration - Cloud-Ready Version
# FIXED: All hardcoded values replaced with environment variable placeholders
# This file serves as a template and documentation for required environment variables

# =============================================================================
# SERVER CONFIGURATION
# =============================================================================
# FIXED: Server configuration from environment variables
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:0.0.0.0}
server.context-path=${SERVER_CONTEXT_PATH:/mini-app}

# =============================================================================
# DATABASE CONFIGURATION (HikariCP Connection Pool)
# =============================================================================
# FIXED: Database configuration from environment variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mini_app_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}
spring.datasource.hikari.pool-name=MiniAppHikariPool
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1

# =============================================================================
# CACHE CONFIGURATION (Redis)
# =============================================================================
# FIXED: Cache configuration from environment variables
cache.redis.host=${REDIS_HOST:127.0.0.1}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=${REDIS_PASSWORD:}
cache.redis.database=${REDIS_DATABASE:0}

# =============================================================================
# EXTERNAL SERVICE URLS
# =============================================================================
# FIXED: External service URLs from environment variables
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com:8080/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
external.api.key=${EXTERNAL_API_KEY:}

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
payment.service.username=${PAYMENT_SERVICE_USERNAME:}
payment.service.password=${PAYMENT_SERVICE_PASSWORD:}

# =============================================================================
# FILE PATHS (Cloud-Ready - No Absolute Paths)
# =============================================================================
# FIXED: File paths removed or made relative to working directory
# For cloud deployments, use cloud storage services (S3, Azure Blob, GCS)
app.config.directory=${APP_CONFIG_DIR:./config}
app.temp.directory=${APP_TEMP_DIR:./tmp}
app.upload.directory=${APP_UPLOAD_DIR:./uploads}

# Note: For production cloud deployments, configure cloud storage:
# AWS: Use S3 bucket URLs (s3://bucket-name/path)
# Azure: Use Blob Storage URLs (https://account.blob.core.windows.net/container)
# GCP: Use GCS bucket URLs (gs://bucket-name/path)

# =============================================================================
# SECURITY CONFIGURATION
# =============================================================================
# FIXED: Security configuration from environment variables (AWS Secrets Manager recommended)
security.jwt.secret=${JWT_SECRET:}
security.admin.username=${ADMIN_USERNAME:}
security.admin.password=${ADMIN_PASSWORD:}
security.encryption.key=${ENCRYPTION_KEY:}

# For AWS: Use AWS Secrets Manager or Parameter Store
# For Azure: Use Azure Key Vault
# For GCP: Use Secret Manager

# =============================================================================
# MONITORING & METRICS
# =============================================================================
# FIXED: Monitoring configuration from environment variables
monitoring.endpoint=${MONITORING_ENDPOINT:http://localhost:9090/metrics}
monitoring.username=${MONITORING_USERNAME:}
monitoring.password=${MONITORING_PASSWORD:}

# Cloud-native monitoring:
# AWS: CloudWatch Metrics and Logs
# Azure: Azure Monitor and Application Insights
# GCP: Cloud Monitoring and Cloud Logging

# =============================================================================
# MESSAGING CONFIGURATION
# =============================================================================
# FIXED: Messaging configuration from environment variables
messaging.rabbitmq.host=${RABBITMQ_HOST:localhost}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${RABBITMQ_USERNAME:}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD:}

# Cloud-native messaging alternatives:
# AWS: Amazon SQS, Amazon SNS, Amazon MQ
# Azure: Azure Service Bus, Azure Event Hubs
# GCP: Cloud Pub/Sub

# =============================================================================
# APPLICATION CONFIGURATION
# =============================================================================
# FIXED: Environment-specific configuration from environment variables
environment=${ENVIRONMENT:development}
debug.enabled=${DEBUG_ENABLED:false}
logging.level.root=${LOG_LEVEL:INFO}

# Cloud-native logging configuration
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =============================================================================
# CLOUD DEPLOYMENT NOTES
# =============================================================================
# This configuration file is now cloud-ready and follows 12-factor app principles:
#
# 1. All sensitive data (passwords, secrets, API keys) should be provided via:
#    - Environment variables
#    - AWS Secrets Manager / Azure Key Vault / GCP Secret Manager
#    - Container orchestration secrets (Kubernetes Secrets, ECS Task Definitions)
#
# 2. File system dependencies have been minimized:
#    - Use classpath resources for read-only configuration
#    - Use cloud storage (S3/Blob/GCS) for file uploads and persistent storage
#    - Use console logging (stdout/stderr) for cloud log aggregation
#
# 3. Database connections use HikariCP connection pooling for:
#    - Efficient resource utilization
#    - Connection reuse and lifecycle management
#    - Cloud-native database integration
#
# 4. All configuration is externalized and can be overridden per environment
#    without rebuilding the application
#
# 5. The application is stateless and can scale horizontally in cloud environments
