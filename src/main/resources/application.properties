# Cloud-Ready Configuration - Using Environment Variables

# Server Configuration - Cloud-Native
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:0.0.0.0}
server.context-path=${SERVER_CONTEXT_PATH:/mini-app}

# Database Configuration - Environment Variables
database.url=${DATABASE_URL:jdbc:mysql://localhost:3306/mini_app_db}
database.username=${DATABASE_USERNAME:root}
database.password=${DATABASE_PASSWORD:changeme}
database.driver=${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}
database.pool.max-connections=${DATABASE_POOL_MAX_CONNECTIONS:20}
database.pool.timeout=${DATABASE_POOL_TIMEOUT:30000}
database.pool.connection-timeout=${DATABASE_CONNECTION_TIMEOUT:30000}
database.pool.idle-timeout=${DATABASE_IDLE_TIMEOUT:600000}
database.pool.max-lifetime=${DATABASE_MAX_LIFETIME:1800000}

# Cache Configuration - Environment Variables
cache.redis.host=${REDIS_HOST:localhost}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=${REDIS_PASSWORD:}
cache.redis.database=${REDIS_DATABASE:0}

# External Service URLs - Environment Variables
external.api.base-url=${EXTERNAL_API_BASE_URL:http://api.example.com:8080/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
external.api.key=${EXTERNAL_API_KEY:}

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
payment.service.username=${PAYMENT_SERVICE_USERNAME:}
payment.service.password=${PAYMENT_SERVICE_PASSWORD:}

# Cloud Storage Paths - Environment Variables (S3 or EFS)
app.config.directory=${APP_CONFIG_DIRECTORY:/app/config}
app.log.directory=${APP_LOG_DIRECTORY:/app/logs}
app.temp.directory=${APP_TEMP_DIRECTORY:/tmp/mini-app}
app.upload.directory=${APP_UPLOAD_DIRECTORY:/app/uploads}
app.storage.type=${APP_STORAGE_TYPE:s3}
app.storage.s3.bucket=${S3_BUCKET_NAME:}
app.storage.s3.region=${AWS_REGION:us-east-1}

# Security Configuration - Environment Variables (Use AWS Secrets Manager)
security.jwt.secret=${JWT_SECRET:}
security.admin.username=${ADMIN_USERNAME:}
security.admin.password=${ADMIN_PASSWORD:}
security.encryption.key=${ENCRYPTION_KEY:}

# Monitoring/Metrics - Environment Variables
monitoring.endpoint=${MONITORING_ENDPOINT:http://localhost:9090/metrics}
monitoring.username=${MONITORING_USERNAME:}
monitoring.password=${MONITORING_PASSWORD:}

# Messaging Configuration - Environment Variables
messaging.rabbitmq.host=${RABBITMQ_HOST:localhost}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${RABBITMQ_USERNAME:}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD:}

# Environment Configuration - Environment Variables
environment=${ENVIRONMENT:development}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOGGING_LEVEL:INFO}

# Cloud-Native Logging Configuration
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
