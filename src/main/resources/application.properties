# Mini Java App Configuration - Cloud-Native Configuration

# Server configuration - externalized
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:0.0.0.0}
server.context-path=${SERVER_CONTEXT_PATH:/mini-app}

# Spring DataSource configuration with HikariCP connection pooling
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/mini_app_db}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool configuration
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_MAX_SIZE:20}
spring.datasource.hikari.connection-timeout=${DATABASE_CONNECTION_TIMEOUT:5000}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.minimum-idle=5

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Query timeout configuration
spring.jpa.properties.hibernate.query.query_timeout=${DATABASE_QUERY_TIMEOUT:30}

# Cache configuration - externalized
cache.redis.host=${REDIS_HOST:localhost}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=${REDIS_PASSWORD:}
cache.redis.database=${REDIS_DATABASE:0}

# External service URLs - externalized
external.api.base-url=${EXTERNAL_API_BASE_URL:http://api.example.com:8080/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
external.api.key=${EXTERNAL_API_KEY:}

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
payment.service.username=${PAYMENT_SERVICE_USERNAME:}
payment.service.password=${PAYMENT_SERVICE_PASSWORD:}

# File paths - externalized
app.config.directory=${APP_CONFIG_DIRECTORY:/opt/app/config}
app.log.directory=${APP_LOG_DIRECTORY:/var/log/mini-app}
app.temp.directory=${APP_TEMP_DIRECTORY:/tmp/mini-app}
app.upload.directory=${APP_UPLOAD_DIRECTORY:/opt/uploads}

# Security configuration - externalized
security.jwt.secret=${JWT_SECRET:}
security.admin.username=${ADMIN_USERNAME:admin}
security.admin.password=${ADMIN_PASSWORD:}
security.encryption.key=${ENCRYPTION_KEY:}

# Monitoring/metrics endpoints - externalized
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com:9090/metrics}
monitoring.username=${MONITORING_USERNAME:}
monitoring.password=${MONITORING_PASSWORD:}

# Spring Boot Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:always}
management.health.db.enabled=true

# Messaging configuration - externalized
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.internal.company.com}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${RABBITMQ_USERNAME:}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD:}

# Environment-specific configuration - externalized
environment=${ENVIRONMENT:production}
debug.enabled=${DEBUG_ENABLED:false}
logging.level.root=${LOGGING_LEVEL:INFO}

# Flyway database migration configuration
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true