# Mini Java App Configuration - Cloud Native Version
# All hardcoded values replaced with environment variable references

# Cloud-native: Server configuration from environment variables
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:0.0.0.0}
server.context-path=${SERVER_CONTEXT_PATH:/mini-app}

# Cloud-native: Database configuration from environment variables
database.url=${DB_URL:jdbc:mysql://localhost:3306/mini_app_db}
database.username=${DB_USERNAME:app_user}
database.password=${DB_PASSWORD:}
database.driver=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
database.pool.max-connections=${DB_MAX_POOL_SIZE:10}
database.pool.timeout=${DB_CONNECTION_TIMEOUT:30000}
database.pool.query-timeout=${DB_QUERY_TIMEOUT:30}

# Cloud-native: Cache configuration from environment variables
cache.redis.host=${REDIS_HOST:localhost}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=${REDIS_PASSWORD:}
cache.redis.database=${REDIS_DATABASE:0}
cache.redis.timeout=${REDIS_TIMEOUT:5000}

# Cloud-native: External service configuration from environment variables
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com:8080/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
external.api.key=${EXTERNAL_API_KEY:}

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.example.com/process}
payment.service.username=${PAYMENT_SERVICE_USERNAME:}
payment.service.password=${PAYMENT_SERVICE_PASSWORD:}
payment.service.timeout=${PAYMENT_SERVICE_TIMEOUT:30000}

# Cloud-native: Configuration directories from environment variables
app.config.directory=${APP_CONFIG_DIR:/app/config}
app.log.directory=${APP_LOG_DIR:/app/logs}
app.temp.directory=${APP_TEMP_DIR:/tmp}
app.upload.directory=${APP_UPLOAD_DIR:/app/uploads}

# Cloud-native: Security configuration from environment variables
security.jwt.secret=${JWT_SECRET:}
security.admin.username=${ADMIN_USERNAME:}
security.admin.password=${ADMIN_PASSWORD:}
security.encryption.key=${ENCRYPTION_KEY:}

# Cloud-native: Monitoring configuration from environment variables
monitoring.endpoint=${MONITORING_ENDPOINT:http://localhost:9090/metrics}
monitoring.username=${MONITORING_USERNAME:}
monitoring.password=${MONITORING_PASSWORD:}
monitoring.enabled=${MONITORING_ENABLED:true}

# Cloud-native: Messaging configuration from environment variables
messaging.rabbitmq.host=${RABBITMQ_HOST:localhost}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${RABBITMQ_USERNAME:}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD:}
messaging.rabbitmq.vhost=${RABBITMQ_VHOST:/}

# Cloud-native: Environment-specific configuration
environment=${ENVIRONMENT:development}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOG_LEVEL:INFO}
logging.format=${LOG_FORMAT:json}

# Cloud-native: Health check configuration
health.check.enabled=${HEALTH_CHECK_ENABLED:true}
health.check.endpoint=${HEALTH_CHECK_ENDPOINT:/health}

# Cloud-native: Metrics configuration
metrics.enabled=${METRICS_ENABLED:true}
metrics.endpoint=${METRICS_ENDPOINT:/metrics}