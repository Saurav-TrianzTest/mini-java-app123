# Mini Java App Configuration - Cloud-Ready Version
#
# FIX cr-java-0070: Application configuration has been externalized from this
# classpath-bundled properties file to AWS Systems Manager (SSM) Parameter Store.
# Configuration is now loaded at runtime via GetParametersByPath API calls,
# enabling environment-specific changes without redeployment.
#
# SSM Parameter Store path hierarchy (set SSM_PARAMETER_PATH env var):
#   Default path prefix: /mini-app
#   Example parameters:
#     /mini-app/server.port
#     /mini-app/server.host
#     /mini-app/database.url
#     /mini-app/cache.redis.host
#     /mini-app/cache.redis.port
#     /mini-app/external.api.base-url
#     /mini-app/payment.service.url
#     /mini-app/environment
#     /mini-app/debug.enabled
#     /mini-app/logging.level
#
# SecureString parameters (encrypted via KMS) for sensitive values:
#     /mini-app/security.jwt.secret
#     /mini-app/security.admin.username
#     /mini-app/security.admin.password
#     /mini-app/security.encryption.key
#     /mini-app/cache.redis.password
#     /mini-app/external.api.key
#     /mini-app/payment.service.username
#     /mini-app/payment.service.password
#     /mini-app/monitoring.username
#     /mini-app/monitoring.password
#     /mini-app/messaging.rabbitmq.username
#     /mini-app/messaging.rabbitmq.password
#
# FIX cr-java-0113: All hardcoded secret values (passwords, API keys, JWT secrets,
# encryption keys) have been removed. Sensitive values MUST be stored as
# SecureString parameters in AWS SSM Parameter Store or AWS Secrets Manager,
# and injected at runtime. No secret defaults are embedded in this file.
#
# FIX cr-java-0077: All hard-coded port numbers have been replaced with
# environment variable placeholders. Inject actual values at runtime via
# ECS task definition environment properties, EKS ConfigMap/Secrets, or
# Elastic Beanstalk environment configuration.
#
# IMPORTANT: This file is intentionally kept minimal. All runtime configuration
# is sourced from AWS SSM Parameter Store (see MiniApp.loadConfigurationFromSsm()).
# Only bootstrap/startup environment variables are listed below.

# ---------------------------------------------------------------------------
# Bootstrap environment variables (used before SSM is available)
# ---------------------------------------------------------------------------
# SSM_PARAMETER_PATH  - SSM Parameter Store path prefix (default: /mini-app)
# AWS_REGION          - AWS region for SSM and other AWS SDK calls (default: us-east-1)
# SERVER_PORT         - HTTP server listening port (default: 8080)
# APP_S3_BUCKET       - S3 bucket for application storage
# APP_CONFIG_S3_KEY   - S3 key for config object (default: config/app.properties)
# APP_LOG_S3_KEY_PREFIX - S3 key prefix for log objects (default: logs/mini-app)
# DB_SECRET_NAME      - AWS Secrets Manager secret name/ARN for DB credentials [REQUIRED]

# ---------------------------------------------------------------------------
# Minimal Spring Boot bootstrap properties (resolved from environment variables)
# ---------------------------------------------------------------------------
# FIX cr-java-0077: server.port reads SERVER_PORT env var
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# SSM Parameter Store bootstrap configuration
# ---------------------------------------------------------------------------
# Path prefix under which all application parameters are stored in SSM
ssm.parameter.path=${SSM_PARAMETER_PATH:/mini-app}
