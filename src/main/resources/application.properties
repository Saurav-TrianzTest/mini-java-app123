# Mini Java App Configuration - Cloud-Ready Version
#
# cr-java-0070 fix: Classpath-bundled properties file loading has been replaced with
# AWS Systems Manager Parameter Store integration.  Application configuration parameters
# are now stored under a hierarchical SSM path and retrieved at runtime via the AWS SSM
# GetParametersByPath API, enabling:
#   - Runtime configuration changes without application redeployment or image rebuilds
#   - Environment-specific configuration via separate SSM paths
#     (e.g. /mini-app/dev/config/, /mini-app/staging/config/, /mini-app/prod/config/)
#   - Centralized configuration management across all services and environments
#   - Full audit logging of every configuration access via AWS CloudTrail
#   - Fine-grained IAM access control over individual parameters
#
# SSM Parameter Store path configuration:
#   SSM_CONFIG_PATH env var controls the path prefix (default: /mini-app/config/)
#
# To populate parameters in SSM Parameter Store, use the AWS CLI:
#   aws ssm put-parameter --name "/mini-app/config/server.port" --value "8080" --type "String"
#   aws ssm put-parameter --name "/mini-app/config/database.url" --value "jdbc:mysql://..." --type "String"
#   aws ssm put-parameter --name "/mini-app/config/cache.redis.host" --value "redis.example.com" --type "String"
#
# NOTE: This file is retained for local development fallback and documentation purposes only.
#       In cloud environments (ECS, EKS, Elastic Beanstalk), all configuration is sourced
#       exclusively from AWS Systems Manager Parameter Store via the SSM_CONFIG_PATH path.
#
# cr-java-0113 fix: All hardcoded secrets (passwords, API keys, JWT secrets,
# encryption keys, and service credentials) have been removed from this file.
# Secrets are now managed exclusively through AWS Secrets Manager.
#
# Secret retrieval pattern:
#   - Each secret group is stored as a JSON object in AWS Secrets Manager.
#   - The secret ARN/name is provided via environment variables (e.g., DB_SECRET_NAME,
#     REDIS_SECRET_NAME, API_SECRET_NAME, etc.).
#   - At runtime, the application calls AWS Secrets Manager to retrieve the JSON
#     secret and extracts individual fields (username, password, key, etc.).
#   - Non-sensitive configuration values are kept here or in environment variables.
#
# AWS Secrets Manager secret naming convention used by this application:
#   mini-app/db-credentials        → { "username": "...", "password": "..." }
#   mini-app/redis-credentials     → { "password": "..." }
#   mini-app/api-credentials       → { "api_key": "..." }
#   mini-app/payment-credentials   → { "username": "...", "password": "..." }
#   mini-app/security-secrets      → { "jwt_secret": "...", "admin_password": "...", "encryption_key": "..." }
#   mini-app/monitoring-credentials→ { "username": "...", "password": "..." }
#   mini-app/rabbitmq-credentials  → { "username": "...", "password": "..." }

# ---------------------------------------------------------------------------
# Server configuration (non-sensitive — resolved from environment variables)
# ---------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:localhost}
server.context-path=/mini-app

# ---------------------------------------------------------------------------
# Database configuration (non-sensitive connection parameters only)
# Credentials are retrieved from AWS Secrets Manager at runtime.
# Secret name is controlled by the DB_SECRET_NAME environment variable.
# ---------------------------------------------------------------------------
database.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mini_app_db}
database.driver=com.mysql.cj.jdbc.Driver
database.pool.max-connections=20
database.pool.timeout=5000
# cr-java-0113: database.username and database.password removed — fetched from
# AWS Secrets Manager using secret name defined by DB_SECRET_NAME env var.
# Secret ARN/name env var: DB_SECRET_NAME (default: mini-app/db-credentials)

# ---------------------------------------------------------------------------
# Cache configuration (non-sensitive connection parameters only)
# Redis password is retrieved from AWS Secrets Manager at runtime.
# ---------------------------------------------------------------------------
cache.redis.host=${REDIS_HOST:127.0.0.1}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.database=0
# cr-java-0113: cache.redis.password removed — fetched from AWS Secrets Manager.
# Secret ARN/name env var: REDIS_SECRET_NAME (default: mini-app/redis-credentials)

# ---------------------------------------------------------------------------
# External service configuration (non-sensitive URLs only)
# API keys and service credentials are retrieved from AWS Secrets Manager.
# ---------------------------------------------------------------------------
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com:8080/v1}
external.api.timeout=30000
# cr-java-0113: external.api.key removed — fetched from AWS Secrets Manager.
# Secret ARN/name env var: API_SECRET_NAME (default: mini-app/api-credentials)

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
# cr-java-0113: payment.service.username and payment.service.password removed —
# fetched from AWS Secrets Manager.
# Secret ARN/name env var: PAYMENT_SECRET_NAME (default: mini-app/payment-credentials)

# ---------------------------------------------------------------------------
# File / storage configuration (replaced with S3 references)
# ---------------------------------------------------------------------------
app.s3.bucket=${S3_BUCKET_NAME:mini-app-bucket}
app.s3.config-key=${S3_CONFIG_KEY:config/app.properties}
app.s3.log-key=${S3_LOG_KEY:logs/mini-app.log}
app.s3.upload-prefix=${S3_UPLOAD_PREFIX:uploads/}
# cr-java-0113: Hardcoded local file paths (/opt/app/config, /var/log/mini-app,
# /tmp/mini-app, /opt/uploads) removed — replaced with S3 bucket/key references.

# ---------------------------------------------------------------------------
# Security configuration (non-sensitive settings only)
# All secrets are retrieved from AWS Secrets Manager at runtime.
# ---------------------------------------------------------------------------
security.admin.username=${SECURITY_ADMIN_USERNAME:admin}
# cr-java-0113: security.jwt.secret, security.admin.password, and
# security.encryption.key removed — fetched from AWS Secrets Manager.
# Secret ARN/name env var: SECURITY_SECRET_NAME (default: mini-app/security-secrets)

# ---------------------------------------------------------------------------
# Monitoring / metrics configuration (non-sensitive endpoint only)
# Credentials are retrieved from AWS Secrets Manager at runtime.
# ---------------------------------------------------------------------------
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com:9090/metrics}
# cr-java-0113: monitoring.username and monitoring.password removed —
# fetched from AWS Secrets Manager.
# Secret ARN/name env var: MONITORING_SECRET_NAME (default: mini-app/monitoring-credentials)

# ---------------------------------------------------------------------------
# Messaging configuration (non-sensitive connection parameters only)
# Credentials are retrieved from AWS Secrets Manager at runtime.
# ---------------------------------------------------------------------------
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.internal.company.com}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
# cr-java-0113: messaging.rabbitmq.username and messaging.rabbitmq.password removed —
# fetched from AWS Secrets Manager.
# Secret ARN/name env var: RABBITMQ_SECRET_NAME (default: mini-app/rabbitmq-credentials)

# ---------------------------------------------------------------------------
# General application settings (non-sensitive)
# ---------------------------------------------------------------------------
environment=${APP_ENVIRONMENT:production}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOG_LEVEL:INFO}
