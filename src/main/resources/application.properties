# =============================================================================
# Mini Java App - Bootstrap Configuration
# =============================================================================
# FIXED (cr-java-0070): All application configuration has been externalised
# from this classpath-bundled properties file to AWS Systems Manager (SSM)
# Parameter Store. This file now serves only as a bootstrap reference document
# and contains NO hardcoded configuration values.
#
# At runtime, MiniApp.loadConfigurationFromSsm() fetches all parameters from
# the SSM path prefix defined by the SSM_CONFIG_PATH_PREFIX environment variable
# (default: /mini-app/config) using GetParametersByPath with recursive traversal.
#
# To provision configuration in SSM Parameter Store, use the AWS CLI:
#   aws ssm put-parameter \
#     --name "/mini-app/config/server.port" \
#     --value "8080" \
#     --type "String" \
#     --region us-east-1
#
# =============================================================================
# SSM Parameter Store Path Prefix
# =============================================================================
# All application parameters are stored under:
#   ${SSM_CONFIG_PATH_PREFIX}/<property-key>
# Default prefix: /mini-app/config
#
# Required SSM parameters (String type unless noted):
#   /mini-app/config/server.port              - HTTP server port
#   /mini-app/config/server.host              - Server bind host
#   /mini-app/config/server.context-path      - Application context path
#   /mini-app/config/database.url             - JDBC connection URL
#   /mini-app/config/database.driver          - JDBC driver class name
#   /mini-app/config/database.pool.max-connections - HikariCP max pool size
#   /mini-app/config/database.pool.timeout    - HikariCP connection timeout (ms)
#   /mini-app/config/cache.redis.host         - Redis host
#   /mini-app/config/cache.redis.port         - Redis port
#   /mini-app/config/cache.redis.database     - Redis database index
#   /mini-app/config/external.api.base-url    - External API base URL
#   /mini-app/config/external.api.timeout     - External API timeout (ms)
#   /mini-app/config/payment.service.url      - Payment service URL
#   /mini-app/config/monitoring.endpoint      - Monitoring/metrics endpoint
#   /mini-app/config/messaging.rabbitmq.host  - RabbitMQ host
#   /mini-app/config/messaging.rabbitmq.port  - RabbitMQ port
#   /mini-app/config/environment              - Deployment environment name
#   /mini-app/config/debug.enabled            - Debug mode flag
#   /mini-app/config/logging.level            - Log level (INFO/DEBUG/WARN/ERROR)
#
# Sensitive credentials (SecureString type) are managed via AWS Secrets Manager:
#   Secret: mini-app/db-credentials           - {"username":"...","password":"..."}
#   Secret: mini-app/redis-credentials        - {"password":"..."}
#   Secret: mini-app/external-api-credentials - {"api_key":"..."}
#   Secret: mini-app/payment-credentials      - {"username":"...","password":"..."}
#   Secret: mini-app/security-credentials     - {"jwt_secret":"...","admin_username":"...","admin_password":"...","encryption_key":"..."}
#   Secret: mini-app/monitoring-credentials   - {"username":"...","password":"..."}
#   Secret: mini-app/rabbitmq-credentials     - {"username":"...","password":"..."}
#
# =============================================================================
# Bootstrap Environment Variables (used before SSM is available)
# =============================================================================
# SSM_CONFIG_PATH_PREFIX  - SSM path prefix (default: /mini-app/config)
# SSM_SERVER_PORT_PARAM   - SSM param for server port (default: /mini-app/server/port)
# AWS_REGION              - AWS region for SDK clients (default: us-east-1)
# SERVER_PORT             - Fallback server port if SSM unavailable (default: 8080)
# =============================================================================
