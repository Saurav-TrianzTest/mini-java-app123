# Cloud-Ready Mini Java App Configuration
# All sensitive values externalized to environment variables and Azure Key Vault

# ============================================================================
# SERVER CONFIGURATION - Externalized
# ============================================================================
# Port configuration uses environment variable with fallback
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.servlet.context-path=${CONTEXT_PATH:/mini-app}

# ============================================================================
# DATABASE CONFIGURATION - Externalized to Azure Key Vault
# ============================================================================
# Database connection uses environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mini_app_db}?useSSL=true&requireSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Configuration with proper timeouts
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION:60000}
spring.datasource.hikari.pool-name=MiniAppHikariPool

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ============================================================================
# REDIS CACHE CONFIGURATION - Externalized
# ============================================================================
cache.redis.host=${REDIS_HOST:localhost}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=${REDIS_PASSWORD:}
cache.redis.database=${REDIS_DATABASE:0}
cache.redis.timeout=${REDIS_TIMEOUT:5000}

# ============================================================================
# EXTERNAL SERVICE URLS - Externalized
# ============================================================================
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
external.api.key=${EXTERNAL_API_KEY:}

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.example.com/process}
payment.service.timeout=${PAYMENT_SERVICE_TIMEOUT:30000}

# ============================================================================
# AZURE BLOB STORAGE CONFIGURATION - Externalized
# ============================================================================
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER:app-data}
app.config.use-blob-storage=${USE_BLOB_STORAGE:false}

# ============================================================================
# AZURE KEY VAULT CONFIGURATION
# ============================================================================
spring.cloud.azure.keyvault.secret.enabled=${AZURE_KEYVAULT_ENABLED:false}
spring.cloud.azure.keyvault.secret.endpoint=${AZURE_KEYVAULT_URI:}

# ============================================================================
# AZURE APP CONFIGURATION
# ============================================================================
spring.cloud.azure.appconfiguration.enabled=${AZURE_APPCONFIGURATION_ENABLED:false}
spring.cloud.azure.appconfiguration.stores[0].endpoint=${AZURE_APPCONFIGURATION_ENDPOINT:}

# ============================================================================
# APPLICATION FILE PATHS - Externalized (Classpath or Blob Storage)
# ============================================================================
app.config.path=${CONFIG_PATH:config/app.properties}
app.log.path=${LOG_PATH:logs/mini-app.log}
app.temp.directory=${TEMP_DIR:/tmp/mini-app}

# ============================================================================
# SECURITY CONFIGURATION - Externalized to Azure Key Vault
# ============================================================================
# JWT and encryption keys should be retrieved from Azure Key Vault
security.jwt.secret=${JWT_SECRET:}
security.jwt.expiration=${JWT_EXPIRATION:86400000}
security.encryption.key=${ENCRYPTION_KEY:}

# ============================================================================
# MONITORING AND METRICS - Externalized
# ============================================================================
monitoring.endpoint=${MONITORING_ENDPOINT:http://localhost:9090/metrics}
monitoring.enabled=${MONITORING_ENABLED:true}

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:when-authorized}
management.metrics.export.prometheus.enabled=${PROMETHEUS_ENABLED:true}

# ============================================================================
# MESSAGING CONFIGURATION - Externalized
# ============================================================================
messaging.rabbitmq.host=${RABBITMQ_HOST:localhost}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${RABBITMQ_USERNAME:guest}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD:}
messaging.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# ============================================================================
# LOGGING CONFIGURATION - Cloud-Native Structured Logging
# ============================================================================
# All logs go to stdout/stderr for cloud log aggregation
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.test=${APP_LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ============================================================================
# ENVIRONMENT CONFIGURATION - Externalized
# ============================================================================
spring.application.name=${APP_NAME:mini-java-app}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}
app.environment=${ENVIRONMENT:production}

# ============================================================================
# TIMEOUT CONFIGURATIONS - Cloud-Ready
# ============================================================================
# HTTP client timeouts
http.client.connect-timeout=${HTTP_CONNECT_TIMEOUT:10000}
http.client.read-timeout=${HTTP_READ_TIMEOUT:30000}
http.client.write-timeout=${HTTP_WRITE_TIMEOUT:30000}

# Database query timeout
db.query.timeout=${DB_QUERY_TIMEOUT:30}

# ============================================================================
# CLOUD PLATFORM CONFIGURATION
# ============================================================================
cloud.platform=${CLOUD_PLATFORM:azure}
cloud.region=${CLOUD_REGION:eastus}

# ============================================================================
# NOTES FOR DEPLOYMENT
# ============================================================================
# 1. All sensitive values (passwords, keys, secrets) should be stored in Azure Key Vault
# 2. Use Azure App Configuration for environment-specific settings
# 3. Set environment variables in Azure App Service Configuration
# 4. Enable Managed Identity for secure access to Azure services
# 5. Configure Application Insights for monitoring and logging
# 6. Use Azure Blob Storage for file persistence instead of local file system
# 7. All ports and endpoints are configurable via environment variables
# 8. Connection pools are configured with proper timeouts for cloud resilience
