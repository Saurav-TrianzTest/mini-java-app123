# Mini Java App Configuration - Cloud-Ready Version
# FIXED: All hardcoded values replaced with environment variable placeholders
# Configuration follows 12-factor app principles for cloud deployment

# ============================================================================
# SERVER CONFIGURATION - Externalized for Cloud Environments
# ============================================================================
# FIXED: Server port from environment variable (AWS ECS, Kubernetes, etc.)
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:0.0.0.0}
server.context-path=${SERVER_CONTEXT_PATH:/mini-app}

# ============================================================================
# DATABASE CONFIGURATION - HikariCP Connection Pool
# ============================================================================
# FIXED: Database connection using environment variables
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mini_app_db}?useSSL=${DB_USE_SSL:true}&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Configuration (Cloud-Optimized)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}
spring.datasource.hikari.pool-name=MiniAppHikariPool
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

# ============================================================================
# CACHE CONFIGURATION - Externalized for Cloud Redis/ElastiCache
# ============================================================================
# FIXED: Redis configuration using environment variables
redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}
redis.password=${REDIS_PASSWORD:}
redis.database=${REDIS_DATABASE:0}
redis.timeout=${REDIS_TIMEOUT:2000}
redis.pool.max-active=${REDIS_POOL_MAX_ACTIVE:8}
redis.pool.max-idle=${REDIS_POOL_MAX_IDLE:8}
redis.pool.min-idle=${REDIS_POOL_MIN_IDLE:0}

# ============================================================================
# EXTERNAL SERVICE URLS - Externalized for Cloud Environments
# ============================================================================
# FIXED: External API configuration using environment variables
external.api.url=${EXTERNAL_API_URL:http://api.example.com/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
external.api.key=${EXTERNAL_API_KEY:}
external.api.retry.max-attempts=${EXTERNAL_API_RETRY_MAX:3}
external.api.retry.backoff=${EXTERNAL_API_RETRY_BACKOFF:1000}

# FIXED: Payment service configuration using environment variables
payment.service.url=${PAYMENT_SERVICE_URL:https://payment.example.com/process}
payment.service.username=${PAYMENT_SERVICE_USERNAME:}
payment.service.password=${PAYMENT_SERVICE_PASSWORD:}
payment.service.timeout=${PAYMENT_SERVICE_TIMEOUT:30000}

# ============================================================================
# FILE PATHS - Removed hardcoded paths, using cloud-native alternatives
# ============================================================================
# FIXED: Configuration directory (use environment variable or cloud config service)
# For cloud: Use AWS Systems Manager Parameter Store, Azure Key Vault, or GCP Secret Manager
app.config.source=${CONFIG_SOURCE:classpath}

# FIXED: Logging to console for cloud environments (CloudWatch, Stackdriver, etc.)
# Cloud platforms capture stdout/stderr automatically
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.test=${APP_LOG_LEVEL:INFO}

# FIXED: Temp directory using system temp (cloud-compatible)
app.temp.directory=${TEMP_DIR:${java.io.tmpdir}}

# FIXED: Upload directory - use cloud storage (S3, Azure Blob, GCS)
# For cloud: Configure S3 bucket, Azure Blob container, or GCS bucket
app.upload.bucket=${UPLOAD_BUCKET:}
app.upload.region=${UPLOAD_REGION:us-east-1}

# ============================================================================
# SECURITY CONFIGURATION - Externalized for Cloud Secret Management
# ============================================================================
# FIXED: JWT secret from environment variable or cloud secret manager
security.jwt.secret=${JWT_SECRET:}
security.jwt.expiration=${JWT_EXPIRATION:86400000}
security.jwt.issuer=${JWT_ISSUER:mini-app}

# FIXED: Admin credentials from environment variables (use IAM in production)
security.admin.username=${ADMIN_USERNAME:}
security.admin.password=${ADMIN_PASSWORD:}

# FIXED: Encryption key from environment variable or cloud KMS
security.encryption.key=${ENCRYPTION_KEY:}
security.encryption.algorithm=${ENCRYPTION_ALGORITHM:AES}

# ============================================================================
# MONITORING & METRICS - Cloud-Native Observability
# ============================================================================
# FIXED: Monitoring endpoint using environment variables
monitoring.endpoint=${MONITORING_ENDPOINT:}
monitoring.username=${MONITORING_USERNAME:}
monitoring.password=${MONITORING_PASSWORD:}
monitoring.interval=${MONITORING_INTERVAL:60000}

# Spring Boot Actuator for health checks (AWS ELB, Kubernetes probes)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true
management.metrics.export.prometheus.enabled=true

# ============================================================================
# MESSAGING CONFIGURATION - Externalized for Cloud Message Brokers
# ============================================================================
# FIXED: RabbitMQ/SQS configuration using environment variables
messaging.broker.type=${MESSAGING_BROKER_TYPE:rabbitmq}
messaging.rabbitmq.host=${RABBITMQ_HOST:localhost}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${RABBITMQ_USERNAME:}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD:}
messaging.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# AWS SQS alternative (for AWS cloud deployments)
messaging.sqs.queue.url=${SQS_QUEUE_URL:}
messaging.sqs.region=${SQS_REGION:us-east-1}

# ============================================================================
# ENVIRONMENT CONFIGURATION - Cloud-Native Deployment
# ============================================================================
# FIXED: Environment detection from environment variable
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}
app.environment=${APP_ENVIRONMENT:development}
app.debug.enabled=${DEBUG_ENABLED:false}

# Cloud platform detection
cloud.platform=${CLOUD_PLATFORM:aws}
cloud.region=${CLOUD_REGION:us-east-1}
cloud.availability-zone=${CLOUD_AZ:}

# ============================================================================
# APPLICATION METADATA
# ============================================================================
spring.application.name=mini-java-app
spring.application.version=1.0.0-cloud-ready
info.app.name=Mini Java Application
info.app.description=Cloud-ready Java application with externalized configuration
info.app.version=1.0.0
