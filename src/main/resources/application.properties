# Mini Java App Configuration - Modernized with Environment Variables Support

# Server configuration with environment variable support
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:localhost}
server.context-path=${SERVER_CONTEXT_PATH:/mini-app}

# Database configuration with environment variables
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/mini_app_db}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password123}
spring.datasource.driver-class-name=${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}

# HikariCP connection pool configuration
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DATABASE_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DATABASE_POOL_TIMEOUT:5000}
spring.datasource.hikari.idle-timeout=${DATABASE_POOL_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DATABASE_POOL_MAX_LIFETIME:1800000}
spring.datasource.hikari.pool-name=HikariPool-MiniApp

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Cache configuration with environment variables
cache.redis.host=${REDIS_HOST:127.0.0.1}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=${REDIS_PASSWORD:redis_secret_123}
cache.redis.database=${REDIS_DATABASE:0}

# External service URLs with environment variables
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com:8080/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
external.api.key=${EXTERNAL_API_KEY:hardcoded_api_key_12345}

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
payment.service.username=${PAYMENT_SERVICE_USERNAME:payment_user}
payment.service.password=${PAYMENT_SERVICE_PASSWORD:payment_secret_456}

# File paths with environment variables
app.config.directory=${APP_CONFIG_DIR:/opt/app/config}
app.log.directory=${APP_LOG_DIR:/var/log/mini-app}
app.temp.directory=${APP_TEMP_DIR:/tmp/mini-app}
app.upload.directory=${APP_UPLOAD_DIR:/opt/uploads}

# Security configuration with environment variables
security.jwt.secret=${JWT_SECRET:my_super_secret_jwt_key_123456789}
security.admin.username=${ADMIN_USERNAME:admin}
security.admin.password=${ADMIN_PASSWORD:admin123}
security.encryption.key=${ENCRYPTION_KEY:encryption_key_hardcoded}

# Monitoring/metrics endpoints with environment variables
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com:9090/metrics}
monitoring.username=${MONITORING_USERNAME:monitor_user}
monitoring.password=${MONITORING_PASSWORD:monitor_pass}

# Messaging configuration with environment variables
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.internal.company.com}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${RABBITMQ_USERNAME:rabbitmq_user}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD:rabbitmq_secret}

# Environment-specific configuration with environment variables
environment=${ENVIRONMENT:production}
debug.enabled=${DEBUG_ENABLED:false}
logging.level.root=${LOGGING_LEVEL:INFO}