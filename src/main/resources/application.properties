# Mini Java App Configuration - Cloud-Ready (AWS)
# All sensitive values have been externalized to AWS Secrets Manager and
# AWS Systems Manager Parameter Store. Hard-coded credentials and file paths
# have been removed.

# ---------------------------------------------------------------------------
# Server configuration
# Port is injected at runtime via the SERVER_PORT environment variable,
# which is set by ECS/EKS task definitions referencing SSM Parameter Store
# entry /mini-app/server-port  (fixes blocker-14, blocker-15)
# ---------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.context-path=/mini-app

# ---------------------------------------------------------------------------
# Database configuration
# Host, port, and name are injected via environment variables backed by
# AWS SSM Parameter Store.  Credentials are retrieved at runtime from
# AWS Secrets Manager (secret name controlled by DB_SECRET_NAME env var).
# Fixes: blocker-8, blocker-9, blocker-10, blocker-11, blocker-12, blocker-16
# ---------------------------------------------------------------------------
database.host=${DB_HOST:localhost}
database.port=${DB_PORT:3306}
database.name=${DB_NAME:mini_app_db}
# Credentials are NOT stored here — fetched from AWS Secrets Manager at runtime.
# Secret name: ${DB_SECRET_NAME:/mini-app/db-credentials}

# HikariCP connection pool settings (fixes blocker-17, blocker-18, blocker-19)
database.pool.max-connections=20
database.pool.min-idle=5
database.pool.connection-timeout=30000
database.pool.idle-timeout=600000
database.pool.max-lifetime=1800000
database.pool.keepalive-time=300000

# ---------------------------------------------------------------------------
# Cache configuration
# Redis host and port injected via environment variables backed by SSM.
# Password retrieved from AWS Secrets Manager.
# Fixes: blocker-13
# ---------------------------------------------------------------------------
cache.redis.host=${REDIS_HOST:127.0.0.1}
cache.redis.port=${REDIS_PORT:6379}
# Redis password is NOT stored here — fetched from AWS Secrets Manager.
cache.redis.database=0

# ---------------------------------------------------------------------------
# External service URLs
# Injected via environment variables — no hard-coded endpoints.
# ---------------------------------------------------------------------------
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com/v1}
external.api.timeout=30000
# API key is NOT stored here — fetched from AWS Secrets Manager.

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
# Payment service credentials are NOT stored here — fetched from AWS Secrets Manager.

# ---------------------------------------------------------------------------
# S3 storage configuration
# Replaces hard-coded file paths /opt/app/config, /var/log/mini-app, /tmp/mini-app
# Fixes: blocker-1, blocker-2, blocker-3, blocker-4, blocker-5, blocker-6, blocker-7
# ---------------------------------------------------------------------------
app.s3.bucket=${APP_S3_BUCKET:mini-app-bucket}
app.s3.config-key=${APP_S3_CONFIG_KEY:config/app.properties}
app.s3.log-key-prefix=${APP_S3_LOG_KEY_PREFIX:logs/mini-app}
app.s3.upload-key-prefix=${APP_S3_UPLOAD_KEY_PREFIX:uploads}

# ---------------------------------------------------------------------------
# AWS configuration
# ---------------------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}
aws.ssm.param-prefix=${SSM_PARAM_PREFIX:/mini-app}
aws.secrets.db-secret-name=${DB_SECRET_NAME:mini-app/db-credentials}

# ---------------------------------------------------------------------------
# Security configuration
# All secrets (JWT key, admin credentials, encryption key) are NOT stored here.
# They are retrieved from AWS Secrets Manager at runtime.
# Fixes: blocker-16
# ---------------------------------------------------------------------------
# security.jwt.secret  → AWS Secrets Manager: mini-app/jwt-secret
# security.admin.*     → AWS Secrets Manager: mini-app/admin-credentials
# security.encryption.key → AWS Secrets Manager: mini-app/encryption-key

# ---------------------------------------------------------------------------
# Monitoring / metrics
# ---------------------------------------------------------------------------
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com:9090/metrics}
# Monitoring credentials are NOT stored here — fetched from AWS Secrets Manager.

# ---------------------------------------------------------------------------
# Messaging configuration
# ---------------------------------------------------------------------------
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.internal.company.com}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
# RabbitMQ credentials are NOT stored here — fetched from AWS Secrets Manager.

# ---------------------------------------------------------------------------
# Application settings
# ---------------------------------------------------------------------------
environment=${APP_ENVIRONMENT:production}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOG_LEVEL:INFO}

# ---------------------------------------------------------------------------
# blocker-20: Properties file in classpath replaced with AWS SSM Parameter Store.
# At runtime, the application reads parameters from SSM using the prefix
# defined by SSM_PARAM_PREFIX (default: /mini-app).  This file now serves
# only as a fallback with safe defaults — no sensitive values are present.
# ---------------------------------------------------------------------------
