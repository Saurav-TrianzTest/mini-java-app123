# ============================================================================
# Mini Java App Configuration — Cloud-Ready (AWS)
# ============================================================================
# FIXED (cr-java-0070 - Properties Files in Classpath):
#   Application configuration has been fully externalised from this classpath-
#   bundled properties file to AWS Systems Manager Parameter Store.
#   Parameters are stored under a hierarchical path prefix in SSM and fetched
#   at runtime via GetParametersByPath, enabling runtime configuration changes
#   without redeployment and full environment-specific configuration management.
#
#   SSM Parameter Path Prefix (configurable via SSM_PARAM_APP_CONFIG_PATH):
#     Default: /mini-app/config
#
#   Example SSM parameters that replace former classpath properties:
#     /mini-app/config/server.context-path
#     /mini-app/config/database.driver
#     /mini-app/config/database.pool.max-connections
#     /mini-app/config/database.pool.timeout
#     /mini-app/config/cache.redis.database
#     /mini-app/config/external.api.timeout
#     /mini-app/config/environment
#     /mini-app/config/debug.enabled
#     /mini-app/config/logging.level
#
# FIXED (cr-java-0113 - Lack of Externalized Secrets):
#   All credentials, API keys, passwords, JWT secrets, and encryption keys
#   have been removed from this file and migrated to AWS Secrets Manager.
#   No secret values are stored in source code or property files.
#
# AWS Secrets Manager secret names (configurable via environment variables):
#   DB_SECRET_NAME          → mini-app/db-credentials
#                             fields: username, password, host, port, dbname
#   CACHE_SECRET_NAME       → mini-app/cache-secrets
#                             fields: redis-password
#   API_SECRET_NAME         → mini-app/api-secrets
#                             fields: api-key
#   PAYMENT_SECRET_NAME     → mini-app/payment-secrets
#                             fields: username, password
#   SECURITY_SECRET_NAME    → mini-app/security-secrets
#                             fields: jwt-secret, encryption-key, admin-username, admin-password
#   MONITORING_SECRET_NAME  → mini-app/monitoring-secrets
#                             fields: username, password
#   MESSAGING_SECRET_NAME   → mini-app/messaging-secrets
#                             fields: username, password
# ============================================================================

# ----------------------------------------------------------------------------
# Server configuration
# Port is resolved from AWS SSM Parameter Store at runtime.
# SSM Parameter: /mini-app/server/port  (override via SSM_PARAM_SERVER_PORT)
# Environment variable fallback: SERVER_PORT
#
# Context path is resolved from AWS SSM Parameter Store at runtime.
# SSM Parameter: /mini-app/config/server.context-path
# Environment variable fallback: SERVER_CONTEXT_PATH
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# Application configuration path (SSM Parameter Store)
# All application configuration is loaded from AWS SSM Parameter Store at
# runtime using GetParametersByPath. The path prefix below is the default;
# override via the SSM_PARAM_APP_CONFIG_PATH environment variable.
# SSM path prefix: /mini-app/config
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# Database configuration
# Credentials (username, password, host, port, dbname) are resolved from
# AWS Secrets Manager at runtime (secret: mini-app/db-credentials).
# Override the secret name via the DB_SECRET_NAME environment variable.
# Non-secret settings are resolved from SSM Parameter Store:
#   /mini-app/config/database.driver
#   /mini-app/config/database.pool.max-connections
#   /mini-app/config/database.pool.timeout
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# Cache configuration
# Redis host and port are resolved from AWS SSM Parameter Store at runtime.
# Redis password is resolved from AWS Secrets Manager (mini-app/cache-secrets).
# SSM Parameters: /mini-app/cache/redis-host, /mini-app/cache/redis-port
# Override via: SSM_PARAM_REDIS_HOST, SSM_PARAM_REDIS_PORT, CACHE_SECRET_NAME
# Non-secret settings resolved from SSM:
#   /mini-app/config/cache.redis.database
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# External service configuration
# API host and port are resolved from AWS SSM Parameter Store at runtime.
# API key is resolved from AWS Secrets Manager (mini-app/api-secrets).
# SSM Parameters: /mini-app/services/external-api-host, /mini-app/services/external-api-port
# Override via: SSM_PARAM_EXTERNAL_API_HOST, SSM_PARAM_EXTERNAL_API_PORT, API_SECRET_NAME
# Non-secret settings resolved from SSM:
#   /mini-app/config/external.api.timeout
# ----------------------------------------------------------------------------

# Payment service URL is resolved from AWS SSM Parameter Store at runtime.
# Payment credentials are resolved from AWS Secrets Manager (mini-app/payment-secrets).
# SSM Parameter: /mini-app/services/payment-service-url
# Override via: SSM_PARAM_PAYMENT_SERVICE_URL, PAYMENT_SECRET_NAME

# ----------------------------------------------------------------------------
# Amazon S3 object storage references
# Replaces hard-coded absolute file paths (cr-java-0061).
# Former hard-coded paths: /opt/app/config, /var/log/mini-app, /tmp/mini-app, /opt/uploads
# ----------------------------------------------------------------------------
app.s3.bucket=${APP_S3_BUCKET:mini-app-bucket}
app.s3.config-key=config/app.properties
app.s3.log-key=logs/mini-app.log
app.s3.temp-prefix=temp/
app.s3.upload-prefix=uploads/
aws.region=${AWS_REGION:us-east-1}

# ----------------------------------------------------------------------------
# Security configuration
# JWT secret and encryption key are resolved from AWS Secrets Manager
# (secret: mini-app/security-secrets).
# Admin credentials are resolved from AWS Secrets Manager
# (secret: mini-app/security-secrets, fields: admin-username, admin-password).
# Override the secret name via the SECURITY_SECRET_NAME environment variable.
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# Monitoring/metrics configuration
# Monitoring endpoint is resolved from AWS SSM Parameter Store at runtime.
# Monitoring credentials are resolved from AWS Secrets Manager
# (secret: mini-app/monitoring-secrets).
# Override via: MONITORING_SECRET_NAME
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# Messaging configuration
# RabbitMQ host and port are resolved from AWS SSM Parameter Store at runtime.
# RabbitMQ credentials are resolved from AWS Secrets Manager
# (secret: mini-app/messaging-secrets).
# Override via: MESSAGING_SECRET_NAME
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# Environment settings
# These values are resolved from AWS SSM Parameter Store at runtime:
#   /mini-app/config/environment   (fallback env var: APP_ENVIRONMENT)
#   /mini-app/config/debug.enabled (fallback env var: DEBUG_ENABLED)
#   /mini-app/config/logging.level (fallback env var: LOG_LEVEL)
# ----------------------------------------------------------------------------
