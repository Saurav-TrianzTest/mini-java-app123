# Cloud-Ready Mini Java App Configuration
# All sensitive values externalized to environment variables and GCP Secret Manager

# ============================================================================
# SERVER CONFIGURATION - Externalized for cloud deployment
# ============================================================================
# FIXED: Port from environment variable (Cloud Run, GKE assign dynamically)
server.port=${PORT:8080}
# FIXED: Removed hardcoded host - cloud platforms manage this
# FIXED: Context path externalized
server.servlet.context-path=${SERVER_CONTEXT_PATH:/mini-app}

# ============================================================================
# DATABASE CONFIGURATION - Externalized with Secret Manager
# ============================================================================
# FIXED: Database URL from environment variable or Secret Manager
spring.datasource.url=${DATABASE_URL:${sm://database-url}}
# FIXED: Credentials from GCP Secret Manager
spring.datasource.username=${DATABASE_USERNAME:${sm://database-username}}
spring.datasource.password=${DATABASE_PASSWORD:${sm://database-password}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Configuration (Cloud-Ready)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=MiniAppHikariPool

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ============================================================================
# CACHE CONFIGURATION - Externalized
# ============================================================================
# FIXED: Redis configuration from environment variables
cache.redis.host=${REDIS_HOST:localhost}
cache.redis.port=${REDIS_PORT:6379}
# FIXED: Redis password from Secret Manager
cache.redis.password=${REDIS_PASSWORD:${sm://redis-password}}
cache.redis.database=${REDIS_DATABASE:0}

# ============================================================================
# EXTERNAL SERVICE URLS - Externalized
# ============================================================================
# FIXED: External API configuration from environment variables
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
# FIXED: API key from Secret Manager
external.api.key=${EXTERNAL_API_KEY:${sm://external-api-key}}

# FIXED: Payment service configuration from environment variables
payment.service.url=${PAYMENT_SERVICE_URL:https://payment.example.com/process}
# FIXED: Payment credentials from Secret Manager
payment.service.username=${PAYMENT_SERVICE_USERNAME:${sm://payment-service-username}}
payment.service.password=${PAYMENT_SERVICE_PASSWORD:${sm://payment-service-password}}

# ============================================================================
# FILE PATHS - Externalized for cloud storage
# ============================================================================
# FIXED: Use classpath resources or GCS bucket paths
app.config.file=${APP_CONFIG_FILE:classpath:config/app.properties}
# FIXED: Use GCS bucket for uploads instead of local filesystem
app.upload.bucket=${GCS_UPLOAD_BUCKET:gs://mini-app-uploads}
# FIXED: Temp directory from environment (cloud platforms provide this)
app.temp.directory=${TMPDIR:/tmp}

# ============================================================================
# SECURITY CONFIGURATION - Externalized
# ============================================================================
# FIXED: JWT secret from Secret Manager
security.jwt.secret=${JWT_SECRET:${sm://jwt-secret}}
# FIXED: Admin credentials from Secret Manager
security.admin.username=${ADMIN_USERNAME:${sm://admin-username}}
security.admin.password=${ADMIN_PASSWORD:${sm://admin-password}}
# FIXED: Encryption key from Secret Manager
security.encryption.key=${ENCRYPTION_KEY:${sm://encryption-key}}

# ============================================================================
# MONITORING CONFIGURATION - Externalized
# ============================================================================
# FIXED: Monitoring endpoint from environment variables
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.example.com/metrics}
# FIXED: Monitoring credentials from Secret Manager
monitoring.username=${MONITORING_USERNAME:${sm://monitoring-username}}
monitoring.password=${MONITORING_PASSWORD:${sm://monitoring-password}}

# Spring Boot Actuator for health checks (Cloud-Ready)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# ============================================================================
# MESSAGING CONFIGURATION - Externalized
# ============================================================================
# FIXED: RabbitMQ configuration from environment variables
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.example.com}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
# FIXED: RabbitMQ credentials from Secret Manager
messaging.rabbitmq.username=${RABBITMQ_USERNAME:${sm://rabbitmq-username}}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD:${sm://rabbitmq-password}}

# ============================================================================
# ENVIRONMENT CONFIGURATION - Externalized
# ============================================================================
# FIXED: Environment from environment variable
app.environment=${ENVIRONMENT:production}
# FIXED: Debug mode from environment variable
app.debug.enabled=${DEBUG_ENABLED:false}

# ============================================================================
# LOGGING CONFIGURATION - Cloud-Native
# ============================================================================
# FIXED: Structured JSON logging for cloud environments
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.test=${APP_LOG_LEVEL:INFO}

# ============================================================================
# SPRING CLOUD GCP CONFIGURATION
# ============================================================================
# Enable GCP Secret Manager integration
spring.cloud.gcp.secretmanager.enabled=true
# GCP Project ID from environment
spring.cloud.gcp.project-id=${GCP_PROJECT_ID:}

# ============================================================================
# DATABASE QUERY CONFIGURATION
# ============================================================================
database.query.timeout=${QUERY_TIMEOUT:30}

# ============================================================================
# CONNECTION TIMEOUT CONFIGURATION
# ============================================================================
# HTTP client timeouts for external services
http.client.connection-timeout=${HTTP_CONNECTION_TIMEOUT:5000}
http.client.read-timeout=${HTTP_READ_TIMEOUT:30000}
