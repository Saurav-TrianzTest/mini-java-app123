# Mini Java App Configuration
# Updated for Java 25 / Spring Boot 3.3.0 compatibility
# SECURITY FIX: Hardcoded credentials replaced with environment variable placeholders
# (JAVA11_TO_25_SECURITY_HARDCODED_CREDENTIALS)

# Server configuration - use environment variables for host/port overrides
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:localhost}
server.context-path=/mini-app

# Database configuration - credentials must be supplied via environment variables
# (JAVA11_TO_25_SECURITY_HARDCODED_CREDENTIALS: removed hardcoded username/password)
database.url=${DATABASE_URL:jdbc:mysql://localhost:3306/mini_app_db}
database.username=${DATABASE_USERNAME:root}
database.password=${DATABASE_PASSWORD:}
database.driver=com.mysql.cj.jdbc.Driver
database.pool.max-connections=${DB_POOL_MAX_CONNECTIONS:20}
database.pool.timeout=${DB_POOL_TIMEOUT:5000}

# Cache configuration - credentials must be supplied via environment variables
# (JAVA11_TO_25_SECURITY_HARDCODED_CREDENTIALS: removed hardcoded redis password)
cache.redis.host=${REDIS_HOST:127.0.0.1}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=${REDIS_PASSWORD:}
cache.redis.database=${REDIS_DATABASE:0}

# External service URLs - supply via environment variables in production
# (JAVA11_TO_25_SECURITY_HARDCODED_CREDENTIALS: removed hardcoded API key)
external.api.base-url=${EXTERNAL_API_BASE_URL:http://api.example.com:8080/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
external.api.key=${EXTERNAL_API_KEY:}

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
payment.service.username=${PAYMENT_SERVICE_USERNAME:}
payment.service.password=${PAYMENT_SERVICE_PASSWORD:}

# File paths - supply via environment variables for container/cloud deployments
app.config.directory=${APP_CONFIG_DIR:/opt/app/config}
app.log.directory=${APP_LOG_DIR:/var/log/mini-app}
app.temp.directory=${APP_TEMP_DIR:/tmp/mini-app}
app.upload.directory=${APP_UPLOAD_DIR:/opt/uploads}

# Security configuration - secrets must be supplied via environment variables
# (JAVA11_TO_25_SECURITY_HARDCODED_CREDENTIALS: removed hardcoded JWT secret and passwords)
security.jwt.secret=${JWT_SECRET:}
security.admin.username=${ADMIN_USERNAME:admin}
security.admin.password=${ADMIN_PASSWORD:}
security.encryption.key=${ENCRYPTION_KEY:}

# Monitoring/metrics endpoints
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com:9090/metrics}
monitoring.username=${MONITORING_USERNAME:}
monitoring.password=${MONITORING_PASSWORD:}

# Messaging configuration
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.internal.company.com}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${RABBITMQ_USERNAME:}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD:}

# Environment settings
environment=${APP_ENVIRONMENT:development}
debug.enabled=${DEBUG_ENABLED:false}
logging.level.root=${LOG_LEVEL:INFO}
