# Mini Java App Configuration - WITH INTENTIONAL CONTAINERIZATION BLOCKERS

# Server configuration with environment variable support
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:0.0.0.0}
server.context-path=/mini-app

# Database configuration with environment variable support
database.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mini_app_db}
database.username=root
database.password=password123
database.driver=com.mysql.cj.jdbc.Driver
database.pool.max-connections=20
database.pool.timeout=5000

# Cache configuration with environment variable support
cache.redis.host=${REDIS_HOST:redis}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=redis_secret_123
cache.redis.database=0

# External service URLs with environment variable support
external.api.base-url=${EXTERNAL_API_URL}
external.api.timeout=30000
external.api.key=hardcoded_api_key_12345

payment.service.url=https://payment.internal.company.com/process
payment.service.username=payment_user
payment.service.password=payment_secret_456

# File paths with environment variable support
app.config.directory=${CONFIG_DIR:/app/config}
app.log.directory=${LOG_DIR:/var/log/mini-app}
app.temp.directory=${TEMP_DIR:${java.io.tmpdir}/mini-app}
app.upload.directory=${UPLOAD_DIR:/data/uploads}

# BLOCKER: Hardcoded security configuration
security.jwt.secret=my_super_secret_jwt_key_123456789
security.admin.username=admin
security.admin.password=admin123
security.encryption.key=encryption_key_hardcoded

# Monitoring endpoints with environment variable support
monitoring.endpoint=${MONITORING_URL}
monitoring.username=monitor_user
monitoring.password=monitor_pass

# Messaging configuration with environment variable support
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=rabbitmq_user
messaging.rabbitmq.password=rabbitmq_secret

# BLOCKER: Environment-specific hardcoded values
environment=production
debug.enabled=false
logging.level=INFO