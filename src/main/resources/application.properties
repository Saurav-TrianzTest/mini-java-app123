# Mini Java App Configuration - Cloud-Ready with Externalized Configuration
# 
# FIXED: All hardcoded values replaced with environment variable placeholders
# Configuration follows 12-factor app principles for cloud-native applications
# 
# Environment variables can be set via:
# - AWS ECS Task Definitions
# - AWS Elastic Beanstalk Environment Properties
# - Kubernetes ConfigMaps and Secrets
# - Docker environment variables
# - System environment variables

# ============================================================================
# SERVER CONFIGURATION - FIXED: Externalized to environment variables
# ============================================================================
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:0.0.0.0}
server.context-path=${SERVER_CONTEXT_PATH:/mini-app}

# ============================================================================
# DATABASE CONFIGURATION - FIXED: Externalized with HikariCP connection pooling
# ============================================================================
# Primary database connection
spring.datasource.url=${DATABASE_URL:jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:mini_app_db}}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}

# HikariCP Connection Pool Configuration - FIXED: Optimized for cloud environments
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}
spring.datasource.hikari.auto-commit=${DB_AUTO_COMMIT:true}
spring.datasource.hikari.pool-name=${DB_POOL_NAME:MiniAppHikariPool}
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION_THRESHOLD:60000}

# ============================================================================
# REDIS CACHE CONFIGURATION - FIXED: Externalized to environment variables
# ============================================================================
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.database=${REDIS_DATABASE:0}
spring.redis.timeout=${REDIS_TIMEOUT:2000}
spring.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:8}
spring.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:8}
spring.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:0}

# ============================================================================
# EXTERNAL API CONFIGURATION - FIXED: Externalized to environment variables
# ============================================================================
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
external.api.key=${EXTERNAL_API_KEY:}
external.api.retry-attempts=${EXTERNAL_API_RETRY_ATTEMPTS:3}
external.api.retry-delay=${EXTERNAL_API_RETRY_DELAY:1000}

# ============================================================================
# PAYMENT SERVICE CONFIGURATION - FIXED: Externalized to environment variables
# ============================================================================
payment.service.url=${PAYMENT_SERVICE_URL:https://payment.example.com/process}
payment.service.username=${PAYMENT_SERVICE_USERNAME:}
payment.service.password=${PAYMENT_SERVICE_PASSWORD:}
payment.service.timeout=${PAYMENT_SERVICE_TIMEOUT:30000}

# ============================================================================
# FILE STORAGE CONFIGURATION - FIXED: Removed hardcoded paths
# Use cloud storage services (S3, Azure Blob, GCS) instead of local file system
# ============================================================================
# REMOVED: app.config.directory=/opt/app/config
# REMOVED: app.log.directory=/var/log/mini-app
# REMOVED: app.temp.directory=/tmp/mini-app
# REMOVED: app.upload.directory=/opt/uploads

# Cloud storage configuration (use appropriate cloud service)
cloud.storage.bucket=${CLOUD_STORAGE_BUCKET:mini-app-storage}
cloud.storage.region=${CLOUD_STORAGE_REGION:us-east-1}
cloud.storage.upload-path=${CLOUD_STORAGE_UPLOAD_PATH:uploads/}
cloud.storage.temp-path=${CLOUD_STORAGE_TEMP_PATH:temp/}

# ============================================================================
# SECURITY CONFIGURATION - FIXED: Externalized to environment variables
# Use AWS Secrets Manager, Azure Key Vault, or GCP Secret Manager in production
# ============================================================================
security.jwt.secret=${JWT_SECRET:}
security.jwt.expiration=${JWT_EXPIRATION:86400000}
security.admin.username=${ADMIN_USERNAME:}
security.admin.password=${ADMIN_PASSWORD:}
security.encryption.key=${ENCRYPTION_KEY:}
security.encryption.algorithm=${ENCRYPTION_ALGORITHM:AES}

# ============================================================================
# MONITORING & METRICS CONFIGURATION - FIXED: Externalized to environment variables
# ============================================================================
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.example.com/metrics}
monitoring.username=${MONITORING_USERNAME:}
monitoring.password=${MONITORING_PASSWORD:}
monitoring.interval=${MONITORING_INTERVAL:60000}

# Spring Boot Actuator for cloud monitoring
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info,metrics,prometheus}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:when-authorized}
management.metrics.export.prometheus.enabled=${PROMETHEUS_ENABLED:true}

# ============================================================================
# MESSAGING CONFIGURATION - FIXED: Externalized to environment variables
# ============================================================================
messaging.rabbitmq.host=${RABBITMQ_HOST:localhost}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${RABBITMQ_USERNAME:}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD:}
messaging.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# ============================================================================
# LOGGING CONFIGURATION - FIXED: Console logging for cloud environments
# Cloud platforms capture stdout/stderr automatically
# ============================================================================
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.test=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework=${LOG_LEVEL_SPRING:INFO}
logging.level.com.zaxxer.hikari=${LOG_LEVEL_HIKARI:INFO}

# FIXED: Use console logging instead of file-based logging
# Cloud platforms (AWS CloudWatch, Azure Monitor, GCP Cloud Logging) capture console output
logging.pattern.console=${LOG_PATTERN:%d{yyyy-MM-dd HH:mm:ss} - %msg%n}

# ============================================================================
# ENVIRONMENT CONFIGURATION - FIXED: Externalized to environment variables
# ============================================================================
spring.profiles.active=${SPRING_PROFILE:default}
app.environment=${APP_ENVIRONMENT:development}
app.debug.enabled=${DEBUG_ENABLED:false}

# ============================================================================
# CLOUD-SPECIFIC CONFIGURATION
# ============================================================================
# AWS Configuration
cloud.aws.region.static=${AWS_REGION:us-east-1}
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:}

# Application metadata
spring.application.name=${APP_NAME:mini-java-app}
spring.application.version=${APP_VERSION:1.0.0}

# ============================================================================
# NOTES FOR CLOUD DEPLOYMENT
# ============================================================================
# 1. Set all environment variables in your cloud platform:
#    - AWS: ECS Task Definition, Elastic Beanstalk, Lambda Environment Variables
#    - Azure: App Service Application Settings, Container Instances Environment Variables
#    - GCP: Cloud Run Environment Variables, App Engine Environment Variables
#
# 2. Use cloud-native secret management:
#    - AWS: AWS Secrets Manager or AWS Systems Manager Parameter Store
#    - Azure: Azure Key Vault
#    - GCP: Google Cloud Secret Manager
#
# 3. Use cloud storage instead of local file system:
#    - AWS: Amazon S3
#    - Azure: Azure Blob Storage
#    - GCP: Google Cloud Storage
#
# 4. Use managed database services:
#    - AWS: Amazon RDS, Amazon Aurora
#    - Azure: Azure Database for MySQL
#    - GCP: Cloud SQL
#
# 5. Use managed cache services:
#    - AWS: Amazon ElastiCache for Redis
#    - Azure: Azure Cache for Redis
#    - GCP: Cloud Memorystore
