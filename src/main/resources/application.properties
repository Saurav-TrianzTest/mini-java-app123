# Mini Java App Configuration - cloud-ready version
# All sensitive values and environment-specific settings should be provided via
# environment variables or Azure App Configuration / Key Vault.

# Server configuration (defaults, can be overridden by APP_SERVER_PORT env var)
server.port=${APP_SERVER_PORT:8080}
server.host=${APP_SERVER_HOST:0.0.0.0}
server.context-path=${APP_SERVER_CONTEXT_PATH:/mini-app}

# Database configuration is externalized to Azure Key Vault; these are only fallbacks
# Use environment variables to point to Key Vault and secret names.
database.url=${DATABASE_URL:}
database.username=${DATABASE_USERNAME:}
database.password=${DATABASE_PASSWORD:}

# Cache configuration (non-sensitive defaults)
cache.redis.host=${CACHE_REDIS_HOST:localhost}
cache.redis.port=${CACHE_REDIS_PORT:6379}

# External service URLs (non-sensitive defaults)
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT_MS:30000}

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.service/process}

# File storage configuration (used by MiniApp for Azure Blob Storage)
app.config.container=${APP_CONFIG_CONTAINER:app-config}
app.config.blob=${APP_CONFIG_BLOB:app.properties}
app.log.container=${APP_LOG_CONTAINER:app-logs}
app.log.blob=${APP_LOG_BLOB:mini-app.log}

# Security-related values must be stored in Azure Key Vault and not here.
# monitoring, messaging, and other environment-specific values should also be
# provided via Azure App Configuration or environment variables.
