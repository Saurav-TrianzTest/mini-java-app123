# AWS-Specific Configuration Profile
# Activate this profile with: --spring.profiles.active=aws
# Or set environment variable: SPRING_PROFILES_ACTIVE=aws

# ============================================================================
# AWS RDS DATABASE CONFIGURATION
# ============================================================================
# Use AWS RDS endpoint
spring.datasource.url=jdbc:mysql://${AWS_RDS_ENDPOINT:your-rds-instance.region.rds.amazonaws.com}:${AWS_RDS_PORT:3306}/${AWS_RDS_DATABASE:mini_app_db}?useSSL=true&serverTimezone=UTC

# AWS RDS credentials (use AWS Secrets Manager in production)
spring.datasource.username=${AWS_RDS_USERNAME:admin}
spring.datasource.password=${AWS_RDS_PASSWORD:}

# ============================================================================
# AWS ELASTICACHE REDIS CONFIGURATION
# ============================================================================
# Use AWS ElastiCache Redis endpoint
cache.redis.host=${AWS_ELASTICACHE_ENDPOINT:your-elasticache.region.cache.amazonaws.com}
cache.redis.port=${AWS_ELASTICACHE_PORT:6379}
cache.redis.password=${AWS_ELASTICACHE_PASSWORD:}

# ============================================================================
# AWS S3 CONFIGURATION FOR FILE STORAGE
# ============================================================================
# Replace local file storage with S3
aws.s3.bucket=${AWS_S3_BUCKET:mini-app-uploads}
aws.s3.region=${AWS_REGION:us-east-1}
app.upload.directory=s3://${aws.s3.bucket}/uploads

# ============================================================================
# AWS SECRETS MANAGER CONFIGURATION
# ============================================================================
# Use AWS Secrets Manager for sensitive data
aws.secretsmanager.enabled=${AWS_SECRETS_ENABLED:true}
aws.secretsmanager.region=${AWS_REGION:us-east-1}

# ============================================================================
# AWS CLOUDWATCH LOGGING
# ============================================================================
# CloudWatch log group
aws.cloudwatch.log-group=${AWS_CLOUDWATCH_LOG_GROUP:/aws/ecs/mini-app}
aws.cloudwatch.log-stream=${AWS_CLOUDWATCH_LOG_STREAM:mini-app}

# ============================================================================
# AWS ECS/EKS HEALTH CHECK
# ============================================================================
# Health check endpoint for ALB/NLB
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.db.enabled=true

# ============================================================================
# AWS XRAY TRACING (Optional)
# ============================================================================
aws.xray.enabled=${AWS_XRAY_ENABLED:false}
aws.xray.daemon-address=${AWS_XRAY_DAEMON:127.0.0.1:2000}
