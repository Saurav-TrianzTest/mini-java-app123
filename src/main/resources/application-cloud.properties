# Cloud-specific configuration profile
# Activate with: --spring.profiles.active=cloud

# ============================================================================
# CLOUD OPTIMIZATIONS
# ============================================================================

# Enable all actuator endpoints for cloud monitoring
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Enable Kubernetes probes
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Enable metrics export
management.metrics.export.prometheus.enabled=true

# ============================================================================
# LOGGING - Structured JSON for cloud
# ============================================================================
logging.pattern.console=
spring.output.ansi.enabled=NEVER

# ============================================================================
# DATABASE - Cloud SQL optimizations
# ============================================================================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# ============================================================================
# SECURITY - Cloud-specific settings
# ============================================================================
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto

# ============================================================================
# GCP SPECIFIC
# ============================================================================
spring.cloud.gcp.secretmanager.enabled=true
spring.cloud.gcp.logging.enabled=true
